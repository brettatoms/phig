name: CI

# paths-ignore keeps prose-only pushes off the runners: plans/ and docs/ cannot
# affect a build, and neither can a top-level *.md. rules/ is deliberately
# absent — its TOML records and generated views are gated by the build-and-test
# job, so a change there has to run. GitHub's workflow parser rejects YAML
# anchors, which is why the list appears twice.
on:
  push:
    branches: [master]
    paths-ignore:
      - 'plans/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'plans/**'
      - 'docs/**'
      - '*.md'

  # The macOS leg and both sanitizer jobs run on this schedule rather than on
  # every push, because cadence is the only thing that moves the bill: at the
  # 10x macOS multiplier that one job is 40 of a full run's 71 billable minutes,
  # so a nightly macOS run would cost what running it per-push already costs.
  # Weekly, Mondays 09:00 UTC.
  schedule:
    - cron: '0 9 * * 1'

  # The same full run, on demand, on any branch — how to clear a portability or
  # sanitizer gate before merging instead of waiting for Monday.
  workflow_dispatch:

# Cancel superseded runs on the same ref. event_name is in the key so the
# scheduled run and a push to master land in different groups: they share a ref,
# and without it a Monday cron would cancel an in-flight push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      # The macOS leg joins only on the scheduled and manual runs — see the
      # schedule comment in `on:` above. An expression rather than a second job,
      # so both legs keep one name and one set of steps.
      matrix:
        os: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && fromJSON('["ubuntu-latest", "macos-latest"]')
          || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      # Pinned to a full commit SHA (supply-chain hardening); comment tracks the tag.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake pkg-config \
            libopencv-dev libsqlite3-dev libexif-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libgtest-dev libspdlog-dev libraw-dev libheif-dev libheif-plugin-libde265 libjxl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache cmake pkg-config opencv sqlite libexif ffmpeg googletest spdlog libraw libheif jpeg-xl

      # Compiling the same unchanged sources on every push is what makes the
      # build step the longest one in the job, so the object cache carries across
      # runs. github.sha in the key makes each run save a fresh entry and
      # restore-keys picks up the newest previous one; Actions cache storage is
      # free and evicted LRU, so a growing set of entries costs nothing.
      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-test-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-test-${{ matrix.os }}-

      # Ten tests need the YuNet and SFace models and skip without them, and one
      # of those is the only witness for rules/concurrency.toml's R52 — a holds
      # rule whose evidence never ran here. 37 MB of ONNX, so the cache carries
      # it between runs; the model dates are in the filenames, so the key stays
      # valid until a model is deliberately bumped. A miss costs a download, not
      # a failure: the step below runs unconditionally and download_face_models()
      # returns early for a file that already exists, so a hit makes it a no-op.
      # GitHub evicts an entry unused for seven days, which a quiet week reaches.
      #
      # Ubuntu only, here and on the download below. R52's gate is the per-push
      # leg, which is this one; the macOS leg is weekly and bills at 10x. Leaving
      # it models-less also keeps ScanEngine.FacesModeFailsClearlyWhenModelsAreMissing
      # running somewhere other than the sanitizer jobs — it is the one test that
      # needs the models absent, so installing them everywhere would retire it.
      - name: Restore face models
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/phig/models
          key: face-models-yunet2023mar-sface2021dec

      - name: Configure
        run: |
          cmake -B build -DPHIG_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      # The hit rate is the only evidence that the cache above is doing anything.
      - name: ccache statistics
        run: ccache --show-stats

      # After the build because the built binary is what downloads them, which
      # keeps the two URLs in core/models.cpp and nowhere else.
      #
      # The hashes are the point of the second half. The files are pinned by
      # name, so opencv_zoo replacing one under the same name would change what
      # the face tests exercise with nothing in the diff to say so, and a
      # restored cache entry is trusted just as blindly. Both become a red build
      # instead of a silent one. Bumping a model means editing core/models.cpp,
      # the cache key above, and the hash here. cmake -E sha256sum rather than
      # sha256sum: cmake is already a dependency and behaves the same on macOS,
      # should this step ever move to that leg.
      - name: Download and verify face models
        if: runner.os == 'Linux'
        run: |
          ./build/phig models download
          for want_file in \
            8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4:face_detection_yunet_2023mar.onnx \
            0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79:face_recognition_sface_2021dec.onnx; do
            want="${want_file%%:*}"; file="${want_file#*:}"
            got="$(cmake -E sha256sum "$HOME/.cache/phig/models/$file" | cut -d' ' -f1)"
            echo "$file: $got"
            [ "$got" = "$want" ] || { echo "::error::$file sha256 is $got, expected $want"; exit 1; }
          done

      # Runs both phig-tests and phig-perf-tests: gtest_discover_tests
      # registers each target's cases into the same ctest run, so this one
      # invocation gates on the perf suite too, not just the fast default one.
      - name: Test
        id: test
        run: ctest --test-dir build --output-on-failure --parallel

      # Ubuntu only, on both steps below: the rule record describes the repo,
      # not a platform, so running it on the macOS leg as well doubles the work
      # for no extra coverage.
      #
      # Both also run after a failing suite, which is what the explicit
      # condition buys — a bare `if:` carries an implicit success(), and a red
      # Test step would then skip the step that says which rule the failing test
      # was pinning. The Test step above is what gates on the suite, so tolerating
      # its failure here hides nothing.
      - name: Rules record — unit tests
        if: ${{ runner.os == 'Linux' && (success() || steps.test.outcome == 'failure') }}
        run: python3 -m unittest discover -s scripts -t scripts -p 'test_*.py'

      # ctest registers one ctest test per gtest case (gtest_discover_tests), so
      # it produces no single gtest XML — hence invoking the binary directly for
      # one. Its exit code is dropped for the reason above; a run that dies
      # before writing results is still reported, because rules.py rejects an
      # unreadable or empty XML rather than reading it as every cited test
      # having been deleted.
      - name: Rules record — check and regenerate
        if: ${{ runner.os == 'Linux' && (success() || steps.test.outcome == 'failure') }}
        run: |
          ./build/phig-tests --gtest_output=xml:build/test-results.xml || true
          python3 scripts/rules.py --check --emit --test-results build/test-results.xml
          git diff --exit-code rules/ || {
            echo "::error::rules/by-*.md are generated from rules/*.toml. Run 'python3 scripts/rules.py --emit' and commit the result — do not edit the views by hand."
            exit 1
          }

  # Sanitizers. Two configurations because ASan and TSan cannot be combined.
  #
  # Both exclude DuplicatesPerf: those tests assert wall-clock budgets, which
  # instrumentation overhead blows through — measured, TSan takes 1957ms and
  # 2526ms against a 1500ms budget. That is the harness losing to the sanitizer,
  # not a regression, and gating on it would only teach people to ignore red.
  #
  # Three things here exist to keep the build from dwarfing the run. Measured on
  # the first attempt, with GCC at -O2 building every target: TSan finished in
  # 7m16s but ASan+UBSan was still compiling after 25 minutes and had to be
  # cancelled.
  #
  #   clang    ASan/UBSan/TSan are LLVM projects and clang's instrumentation is
  #            the reference implementation; GCC's is what blew up. This gate
  #            exists to find races and UB, not to match the production
  #            compiler — the ubuntu test job above already covers GCC.
  #   -O1      What upstream recommends for sanitizer builds. UBSan's extra
  #            branches are exactly what makes -O2 expensive, and -O2 buys a
  #            gate nothing.
  #   --target Only phig-tests is run, so building the phig CLI and
  #            phig-perf-tests is wasted work.
  sanitizers:
    name: sanitizers (${{ matrix.san }})
    # Scheduled and manual runs only — see the schedule comment in `on:` above.
    # Deliberately without ccache, unlike the test and gtk jobs: at a weekly
    # cadence the cache is a week stale by the time it is read, so the restore
    # would be paid against a miss.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan-ubsan
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer"
          - san: tsan
            flags: "-fsanitize=thread -fno-omit-frame-pointer"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          # build-essential stays alongside clang: it supplies make and the
          # libstdc++ headers clang uses as its standard library on Linux.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake pkg-config \
            libopencv-dev libsqlite3-dev libexif-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libgtest-dev libspdlog-dev libraw-dev libheif-dev libheif-plugin-libde265 libjxl-dev

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        # -O1 goes in the per-config flags, not CMAKE_CXX_FLAGS: CMake appends
        # the config's flags after the general ones, so a build type's own -O
        # would win and silently override it.
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS_RELWITHDEBINFO="-O1 -g" \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O1 -g" \
            -DCMAKE_C_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"

      # Only what the Test step runs. CMake registers a failing placeholder for
      # the target that is skipped, which the -E below filters out.
      - name: Build
        run: cmake --build build --parallel --target phig-tests

      # OMP_NUM_THREADS=1 is required, not tidiness. OpenCV's parallel backend
      # on Linux is OpenMP, libgomp is not TSan-instrumented, so TSan cannot see
      # its barriers and every parallel region inside a detect() or decode looks
      # like unsynchronized access — roughly 120 false positives that bury any
      # real finding. See "ThreadSanitizer" in CLAUDE.md.
      #
      # halt_on_error makes a finding fail the job: UBSan otherwise reports and
      # keeps going, which would let a real diagnostic pass as green.
      #
      # GTEST_DEATH_TEST_STYLE=threadsafe is what keeps this gate from flaking.
      # The suite has two EXPECT_EXIT tests, and gtest's default "fast" style
      # forks without re-exec — leaving the child holding a sanitizer runtime
      # that is not fork-safe. Measured on the concurrent-thumb EXPECT_EXIT
      # under TSan: 3 of 40 runs died in the child with the default style, 0 of
      # 40 with threadsafe, which re-execs instead.
      #
      # detect_leaks=0 is a deliberate limit, not an oversight: leak detection
      # would report through OpenCV and LibRaw, which this gate has no way to
      # fix. Memory errors and races are what it is for.
      #
      # scripts/tsan.supp drops GDAL's lock-order inversions, which arrive
      # through OpenCV's imgcodecs on every image decode — see that file.
      # log_path is what makes a failure diagnosable. Without it the runtimes
      # write to stderr, ctest --parallel interleaves that across processes, and
      # the report headers are lost — leaving orphaned stack frames with no
      # finding attached, which is exactly what the first failing run produced.
      # Each process gets its own file instead, uploaded below.
      - name: Test
        env:
          OMP_NUM_THREADS: 1
          GTEST_DEATH_TEST_STYLE: threadsafe
          ASAN_OPTIONS: detect_leaks=0:log_path=${{ github.workspace }}/sanlogs/asan
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:log_path=${{ github.workspace }}/sanlogs/ubsan
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/scripts/tsan.supp:log_path=${{ github.workspace }}/sanlogs/tsan
        run: |
          mkdir -p sanlogs
          ctest --test-dir build --output-on-failure --parallel \
            -E 'DuplicatesPerf|_NOT_BUILT'

      - name: Upload sanitizer reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-reports-${{ matrix.san }}
          path: sanlogs/
          if-no-files-found: ignore

  # gtk/ is a separate CMake project that consumes phig through pkg-config
  # rather than by source path, so this installs libphig first and points
  # PKG_CONFIG_PATH at it. Linux only — gtk/ is the Linux client (see
  # "Platform boundaries" in CLAUDE.md).
  gtk:
    name: build & test (gtk)
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake pkg-config \
            libopencv-dev libsqlite3-dev libexif-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libgtest-dev libspdlog-dev libraw-dev libheif-dev libheif-plugin-libde265 libjxl-dev \
            libgtk-4-dev libadwaita-1-dev

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gtk-${{ github.sha }}
          restore-keys: ccache-gtk-

      # Only the two targets `cmake --install` needs. phig-tests and
      # phig-perf-tests are half the build and belong to the ubuntu test job —
      # measured on 12 cores, 35s for everything against 18s for these two. The
      # phig CLI is here because install(TARGETS phig) fails without it, not
      # because gtk/ has any use for it.
      - name: Build and install libphig
        run: |
          cmake -B build -DPHIG_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel --target phig_abi phig
          cmake --install build --prefix "$PWD/prefix"
          ccache --show-stats

      - name: Build gtk client
        run: |
          PKG_CONFIG_PATH="$PWD/prefix/lib/pkgconfig" \
            cmake -S gtk -B gtk/build \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build gtk/build --parallel

      - name: Test gtk client
        run: ctest --test-dir gtk/build --output-on-failure --parallel

  lint:
    name: lint (clang-format + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install dependencies and pinned lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libopencv-dev libsqlite3-dev libexif-dev libcurl4-openssl-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libgtest-dev libspdlog-dev libraw-dev libheif-dev libheif-plugin-libde265 libjxl-dev
          # Pin clang tools to the version mise pins, so formatting/analysis is
          # version-stable across machines and CI.
          pipx install clang-format==21.1.8
          pipx install clang-tidy==21.1.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The pin is only real if PATH actually resolves to it. Ubuntu ships its
      # own clang-format/clang-tidy, and a silently-shadowed pin means the gate
      # reports different findings than a local run — which is what happened
      # before: run-clang-tidy resolved clang-tidy-18 and reported 0 findings
      # where the pinned 21.1.6 reports 45.
      - name: Verify pinned lint tool versions
        run: |
          for tool_ver in clang-format:21.1.8 clang-tidy:21.1.6; do
            tool="${tool_ver%:*}"; want="${tool_ver#*:}"
            got="$("$tool" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            echo "$tool: want $want, got $got ($(command -v "$tool"))"
            [ "$got" = "$want" ] || { echo "::error::$tool is $got, expected $want"; exit 1; }
          done

      # No -maxdepth: nested files were uncovered, which left the versioned
      # public header include/phig/phig.h unlinted by the gate that exists to
      # keep it consistent.
      - name: clang-format
        run: |
          find core libphig cli tests -type f \
            \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

      - name: Configure (generate compile_commands.json + version.h)
        run: cmake -B build

      - name: clang-tidy
        run: ./scripts/clang-tidy.sh
