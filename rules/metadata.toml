[[rule]]
id = "R35"
tier = "engine"
concern = "metadata"
statement = "A re-scan of an already-indexed path updates that row in place rather than replacing it, so the row keeps its id and the tags, favorite and gallery attached to it."
rationale = "INSERT OR REPLACE deletes the row before inserting the new one, and with foreign_keys=ON that cascades image_tags and faces away and hands the file a new id, so every re-scan would silently strip the one thing a re-scan cannot rebuild. ON CONFLICT(path) DO UPDATE keeps the id and rewrites only the derived columns — hash, phash, dimensions, metadata blob, effective date — and gallery is not in the SET list at all, so a re-scan cannot clear it. The favorite flag needs no clause of its own because it is a row in image_tags like any other tag. Plan 022 finding #1 made this change. Measured with the built binary: tagging a file, favoriting it, setting its gallery and then re-scanning with --force left the tag, the favorite, the gallery and the row id exactly as they were."
enforced_at = ["core/database.cpp:Database::insert"]
binds = ["scan.walk"]
protects = ["user-metadata", "db-row"]
tests = [
    "DatabaseTest.ReinsertPreservesRowIdAndTags",
    "DatabaseTest.ReinsertPreservesGallery",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R36"
tier = "engine"
concern = "metadata"
statement = "A re-scan of a file whose sha256 differs from the one recorded, or with none recorded, clears the row's unnamed faces and keeps its named ones until a re-detection carries their labels or reports them dropped; when the two match it keeps every face — boxes, embeddings and person labels."
rationale = "A face box and its embedding describe pixels, so once the bytes change they describe pixels that no longer exist; an unnamed face holds nothing else and goes. A named face also holds a person label, which is user-authored and which nothing can reconstruct, so it stays: Database::insert keeps it with its box, embedding and model, and marks its frame replaced (frame_source 'replaced', frame hash and size unknown), which also keeps carry_labels from matching it by box overlap against a frame it was never measured in. A RAW's faces are measured on its sidecar JPEG or embedded preview, never on the file, so the mark has to be explicit; comparing a face's frame hash with the row's would call every RAW face replaced. A scan that detects faces then hands the image to replace_faces, the routine face rebuild uses, on both its changed-file and unchanged-file paths: carried labels are written onto the new detections, an unmatched one is dropped and counted in ScanResult::labels_dropped, and the CLI warns. A scan that detects no faces, such as libphig's index, leaves the named faces kept for the next face rebuild or face-detecting scan. An unchanged file must not lose a label to an ordinary re-scan, and --force hash alone must not either: the test is the hash, not the flag."
enforced_at = [
    "core/database.cpp:Database::insert",
    "core/database.cpp:keep_named_faces_of_replaced_frame",
    "core/database.cpp:has_replaced_faces",
    "core/faces_engine.cpp:replace_faces",
    "core/scan_engine.cpp:ScanEngine::run_workers",
]
binds = ["scan.walk"]
protects = ["user-metadata"]
tests = [
    "DatabaseTest.ReinsertSameContentKeepsFaces",
    "DatabaseTest.ReinsertChangedContentKeepsOnlyNamedFacesMarkedReplaced",
    "FacesEngineRun.AScanWithoutFacesOfAnEditedFileKeepsItsNamedFace",
    "FacesEngineRun.AScanWithFacesOfAnEditedFileCarriesItsName",
    "FacesEngineRun.AScanWithFacesDropsAndCountsANameNoFaceMatches",
    "FacesEngineRun.AScanWithFacesCarriesANameAnEarlierScanWithoutFacesKept",
    "FacesEngineRun.ARebuildAfterAScanCarriesTheNameOfAnEditedPhoto",
]
test_kind = "witness"
status = "holds"
test_gap = "The four tests that detect faces skip wherever the face path cannot run (R72), so ubuntu-26.04 is the only CI leg that runs them; the Database test and the scan without faces run everywhere. The CLI's warning on a scan that dropped a label is untested; face rebuild's is pinned by FacesEngineRun.CliRebuildWarnsWhenItDropsALabel."

[[rule]]
id = "R37"
tier = "engine"
concern = "metadata"
statement = "A metadata transfer unions the source's tags onto the target, fills the target's gallery only when it has none, and moves the source's faces onto it only when the target has none; the source's tags and gallery are left in place."
rationale = "The three fields fail differently, so they are resolved differently. Tags are a set and a union loses nothing, and the favorite flag rides along because it is a tag. A gallery is a single value, so one of the two has to win, and the target's is the later statement of intent — the user assigned it to the row that still has a file. Faces are the same choice with a sharper edge: detections already on the target came from the pixels that are still there, so stale boxes must not displace them, and the count is checked in C++ rather than as a NOT EXISTS in the UPDATE, which would see the rows it had just moved and stop after one. Faces are also the one field that leaves the source changed. The clause is UPDATE faces SET image_id = ?, a move rather than a copy, so a transfer that fires strips the source row of its faces — DatabaseTest.TransferUserMetadataMovesTagsGalleryFaces asserts exactly that. Each caller commits its own transfer alone, and the source row is deleted afterwards in a separate transaction that run_reconcile opens once every pass has finished, so a source row stripped of its faces and not yet deleted is a state the database really passes through and an interrupted run can leave standing; R38 is the ordering and R30 is the rule that owns what an interruption in that window leaves behind. The window costs no label: the faces sit on the row the pass designates as the survivor, and the next scan finishes the deletion. Measured by forcing the window by hand — moving a labelled face to the target and leaving the source row in place — then re-scanning, which removed the source row and left the face and the name alice on the target. The statement names what is left in place because a caller that transferred between two rows it meant to keep would find the source stripped, and no other rule would tell it."
enforced_at = ["core/database.cpp:transfer_user_metadata"]
binds = ["scan.reconcile", "relink.transfer", "relink.demote", "relink.demote_live_photo"]
protects = ["user-metadata"]
tests = [
    "DatabaseTest.TransferUserMetadataMovesTagsGalleryFaces",
    "DatabaseTest.TransferUserMetadataTargetGalleryAndFacesWin",
    "RelinkTest.SingleCandidateTransfersMetadata",
    "RelinkTest.DemotesJpegToSameBasenameRaw",
]
test_kind = "conformance"
status = "holds"

[[rule]]
id = "R38"
tier = "engine"
concern = "metadata"
statement = "Reconcile runs every transfer pass to completion before it deletes anything: the relink pass and both demote passes finish, and only then is the collected list of paths deleted."
rationale = "The transfer reads the row it is about to lose, so the order is not a preference — a delete first would take the tags with it and leave nothing to move. This rule is the ordering only; which rows actually get a transfer is R16's, and the answer is not all of them — a stale row with no relink candidate, or with two, is deleted with its metadata rather than transferred. Both branches of run_reconcile have the same shape and neither interleaves: relink_moved_rows, then demote_jpeg_rows, then demote_live_photo_rows, then one delete_paths_logged (or delete_paths) over removed_paths plus every demoted path. That also means the demoted rows are not deleted by the pass that emptied them; they join the same list, which is what keeps the deletion in one transaction. Measured with the built binary: dropping a same-basename RAW beside an indexed, tagged JPEG and re-scanning moved the tag and the gallery onto the RAW row and wrote a relink entry and a purge_row entry in that order, under one scan operation."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/relink.cpp:relink_moved_rows",
    "core/relink.cpp:demote_jpeg_rows",
    "core/relink.cpp:demote_live_photo_rows",
]
binds = ["scan.reconcile", "relink.transfer", "relink.demote", "relink.demote_live_photo"]
protects = ["user-metadata", "db-row"]
tests = [
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTarget",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTargetUnlogged",
    "ScanEngine.ReconcileDemotesALivePhotoVideoRow",
    "ScanEngine.ReconcileFinishesEveryTransferPassBeforeItDeletesAnything",
]
test_kind = "witness"
status = "holds"
test_gap = "The ordering is now caught rather than inferred: with every DELETE on images aborted, one run drives all three passes and is observed with each pass's tag transferred onto its target and not one of the five rows removed. That is the logged branch. The unlogged branch runs the same three passes and ends in delete_paths instead of delete_paths_logged, and no test blocks its delete."

[[rule]]
id = "R39"
tier = "engine"
concern = "metadata"
statement = "When a moved row and a demoted JPEG both transfer into the same surviving row, the moved row's gallery is the one that lands, because relink runs before demote and a gallery transfer fills only an empty target."
rationale = "The case is ordinary: a RAW moves on disk and a JPEG sits beside its new location, so relink_moved_rows and demote_jpeg_rows both target the RAW's row. Every other field is order-independent — tags union, and faces move only into a row with none — so the whole of the ordering's visible effect is which gallery survives. The order is the one that keeps the user's own relocation authoritative: the moved row is the same photo the user filed, while the demoted JPEG is an attachment being folded in. Nothing in the code declares the dependency, so it is pinned by tests at both levels and stated here; the counts are identical either way, which is what makes it easy to invert by accident."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/relink.cpp:relink_moved_rows",
    "core/relink.cpp:demote_jpeg_rows",
    "core/database.cpp:transfer_user_metadata",
]
binds = ["scan.reconcile", "relink.transfer", "relink.demote"]
protects = ["user-metadata"]
tests = [
    "RelinkTest.RelinkRunsBeforeDemoteOnSharedTarget",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTarget",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTargetUnlogged",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R40"
tier = "engine"
concern = "metadata"
statement = "Dropping a row because a move or a copy has taken its path writes a restore snapshot for it, so the tags and gallery that row carried can still be named afterwards."
rationale = "Both organize branches drop a row that already names the destination: update_path_in_txn deletes it so repointing the source does not hit UNIQUE(path), and insert_copy replaces it. The deletion cascades image_tags and takes the gallery column with the row, and delete_faces_for_image clears the faces first because the FK cascade cannot reach vec_faces. Nothing is recorded — no purge_row entry, no restore_json, and the move or copy entry that is written names only the source and the destination. Plan 022 finding #8 ruled the deletion itself correct on the grounds that the old row described a dead file, and added the vec_faces cleanup; it did not consider the snapshot, and it predates plan 023, which established that phig transfers a stale row's metadata rather than dropping it. R04 states the snapshot rule for the other deleting paths and binds scan.reconcile and the four removal modes, so these two are the gap in its coverage. Measured with the built binary, no override and the default --on-conflict skip: a tracked file at the destination whose file had been deleted left a stale row carrying the tag 'precious' and the gallery 'wedding'; a subsequent mv of another file to that path reported Done: 1, Skipped: 0, Errors: 0 and exit 0, and the row, its tag association and its gallery were gone with only a move entry in the log. The same setup under cp replaced the row the same way."
enforced_at = ["core/database.cpp:update_path_in_txn", "core/database.cpp:insert_copy"]
binds = ["organize.copy", "organize.move"]
protects = ["user-metadata", "db-row", "activity-log"]
tests = [
    "DatabaseTest.UpdatePathOntoStaleDestClearsItsFaces",
    "DatabaseTest.InsertCopyOntoStaleDestClearsItsFaces",
]
test_kind = "witness"
status = "violated"
test_gap = "Both listed tests pin today's contrary behaviour — the occupant row and its faces go — which is what plan 022 asked for. Nothing tests the statement, because no code path implements it, and neither test puts a tag or a gallery on the row it destroys, so the loss those two carry is only visible by running the binary. UpdatePathOntoStaleDestClearsItsFaces is also one of the three DatabaseTest cases plan 046 records as failing on Linux, so on that platform this rule's only witness is InsertCopyOntoStaleDestClearsItsFaces. Plan 041's decision 6 now names update_path_in_txn and insert_copy explicitly and its Testing section specifies the two tests this rule needs — a tracked destination carrying a tag and a gallery, moved or copied onto under the default --on-conflict skip, produces a purge_row entry naming both — but neither test is written yet, so the gap is that the work is undone, not that 041's scope excludes it."

[[rule]]
id = "R76"
tier = "engine"
concern = "metadata"
statement = "No value of --force re-detects faces: a scan keeps a row's existing face data whatever it was told to force. Face rebuild is the only path that replaces an unchanged file's faces; a changed file's kept named faces are carried by a face-detecting scan (R36)."
rationale = "ForceOptions carries hash, thumbs and faces, and core/ reads the first two only. A grep for force.faces over core/ and libphig/ returns the declaration at core/scan_engine.h:18 and nothing else: the field is written by cli/main.cpp:1904 and by set_all(), and read only by ForceOptions::any(), which nothing calls. --force hash does bypass the mtime skip and reprocess the file, but run_workers re-adds this run's detections only when db_.has_faces is false or the image holds named faces kept from a replaced frame, and insert() changes faces only when the sha256 changed (R36), so an unchanged file keeps what it had however it was reprocessed. Measured with the built binary on a one-image collection: `scan --faces` reported Faces: 1; a plain repeat reported Processed: 0, Faces: 0; `scan --faces --force faces` reported Processed: 0, Skipped: 1, Faces: 0, identical to the plain repeat; and `scan --faces --force all` reported Processed: 1 — the file was decoded and its faces detected again — with Faces: 0, the detections discarded. The effect is protective, since a person label is the one thing a rescan cannot rebuild, but it is not what the flag says: the help text reads 'Re-process: hash,thumbs,faces,all' and one third of that is inert."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_workers",
    "core/database.cpp:Database::insert",
]
binds = ["scan.walk"]
protects = ["user-metadata"]
tests = [
    "DatabaseTest.ReinsertSameContentKeepsFaces",
    "ScanEngine.NoForceValueDropsAFacesPersonLabel",
    "ScanEngine.ForceFacesAloneDoesNotEvenReprocessTheFile",
]
test_kind = "witness"
status = "holds"
test_gap = "Two tests now build a ScanOptions with force.faces set and drive ScanEngine rather than Database::insert: a labelled face survives a --force all rescan of an unchanged file, and force.faces alone leaves result.processed at 0 because nothing reads the field. The faces-mode half is not covered — run_workers re-adds this run's detections only when db_.has_faces is false, so the discarded detections a `--force all --faces` scan produces need a real detector and gate on face_path_blocker() like the other face tests. R36's rationale asserted that a '--force faces' scan replaces face data; it was corrected in the commit that added this record."

[[rule]]
id = "R79"
tier = "engine"
concern = "metadata"
statement = "Assigning a gallery replaces the assignment already on a row unless the caller asked to fill only the empty ones."
rationale = "set_gallery picks between two statements on its no_overwrite argument: 'UPDATE images SET gallery = ? WHERE path = ?' and the same with 'AND gallery IS NULL'. The default replaces, so a second `phig gallery set` over an overlapping selection discards the first name, and a gallery is user-authored metadata that nothing rebuilds. There is no prompt, no backup and no record: metadata.write opens no logged operation, so unlike a move or a removal this leaves nothing in the activity log and no restore snapshot to read the old name out of. --no-overwrite is the only way to ask for the safe order, and the count it returns is what tells the caller how many rows it declined to touch. clear_gallery is the opposite corner and needs no flag, narrowing to 'gallery IS NOT NULL' so a row without one is not counted as cleared. This is the same fill-only-when-empty rule reconcile applies to a transferred gallery (R37), with the difference that reconcile applies it always and this applies it on request."
enforced_at = [
    "core/database.cpp:set_gallery",
    "core/database.cpp:clear_gallery",
]
binds = ["metadata.write"]
protects = ["user-metadata"]
tests = [
    "DatabaseTest.GalleryOverwritesByDefault",
    "DatabaseTest.GalleryNoOverwriteSkips",
    "DatabaseTest.ClearGallery",
    "DatabaseTest.CliGallerySetHonorsNoOverwriteAndClearRefusesTheFlag",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The parser branch is now driven through the binary, both of its effects: `gallery set --no-overwrite` reports 'on 0 images' and leaves the existing name, and `gallery clear --no-overwrite` exits 1 with 'Unknown option'. A control run without the flag replaces the name, so neither assertion can be satisfied by a `gallery set` that simply never writes. Measured with the branch changed to 'arg == \"--no-overwrite\"' setting no_overwrite = false: the declined run reports 'on 1 images' and the name becomes 'second', and the clear exits 0 having cleared the row. What remains is the other anchor's count. clear_gallery narrows to 'gallery IS NOT NULL' so a row that had no gallery is not reported as cleared, and DatabaseTest.ClearGallery only clears a row that has one — nothing shows that a selection of rows without galleries comes back 0 rather than counting them all."

[[rule]]
id = "R85"
tier = "engine"
concern = "metadata"
statement = "A face rebuild carries each person label to a matching re-detected face in the same image, one label per face, and counts every label it does not carry."
rationale = "A person label is typed by a user and cannot be derived again from pixels, while a rebuild replaces every face row of the images it selects. FacesEngine::run reads the image's labelled faces inside the per-image transaction before deleting them, carry_labels matches them to the new detections, greedy and one-to-one, and the matched labels are written before auto_label_face names the rest. Matching is by embedding when the recognition model is unchanged and by intersection over union at kLabelCarryMinOverlap when the model changed and the recorded frame is identical to the new decode (R86). Labels with no match are counted in FacesResult::labels_dropped."
enforced_at = [
    "core/faces_engine.cpp:FacesEngine::run",
    "core/faces.cpp:carry_labels",
    "core/database.cpp:get_labelled_faces_for_image",
]
binds = ["faces.rebuild"]
protects = ["user-metadata"]
tests = [
    "FacesEngineRun.RebuildKeepsALabelOnTheFaceItNamed",
    "FacesEngineRun.RebuildCountsALabelItCouldNotCarry",
    "FacesEngineRun.CliRebuildWarnsWhenItDropsALabel",
    "AbiOperations.FacesResultReportsLabelsItCouldNotCarry",
    "CarryLabels.AnIdenticalBoxCarriesItsLabel",
    "CarryLabels.OneDetectedFaceTakesAtMostOneLabel",
]
test_kind = "witness"
status = "holds"
test_gap = "The engine, CLI and ABI witnesses skip wherever the face path cannot run, so ubuntu-26.04 is the only CI leg that runs them. The original witnesses rebuild over the same model and pixels; differing decoded pixels are exercised by FacesEngineRun.RebuildCarriesALabelWhenTheImageIsReplacedByARescaledCopy, ...ByACroppedCopy and ...ByOverlapWhenTheRecordedFrameMatches, which R60 lists. Nothing exercises a partial-overlap match exactly at the threshold."

[[rule]]
id = "R86"
tier = "engine"
concern = "metadata"
statement = "Under an unchanged recognition model a carried face label lands only on a re-detected face whose unit-normalized embedding lies within kLabelCarryMaxDistance of the labelled face's; after a model change it lands only on a face overlapping at kLabelCarryMinOverlap within a frame recorded as identical (same bytes by sha256 and same size); any other label is dropped and counted, and a label never moves by box position across frames that are not recorded identical."
rationale = "kLabelCarryMaxDistance is 1.128, SFace's published same-identity threshold on unit-normalized embeddings. A rebuild re-detects faces and carries each image's labels onto the new detections. Box positions depend on the decoded frame, which can change without changing its size — a square image rotated 90 degrees, any image rotated 180 degrees or mirrored — so a box match can attach a name to the wrong person with no signal. carry_labels therefore matches by embedding when the recognition model is unchanged, since embeddings come from aligned face crops and do not depend on the frame, and by box overlap only when the model changed and the face rows record a frame identical to the new decode (same bytes by sha256, same size). Anything else is dropped and counted in labels_dropped. A wrong label is worse than a dropped one: a drop is reported, a wrong label is not. The two passes share one set of taken detections, so a detection takes at most one label across both. FacesEngine records a file's row sha256 as the frame hash only while the file's mtime and size still match the row; otherwise the frame hash is empty and the overlap pass cannot match. A same-model embedding match is a biometric threshold, not an identity: a lookalike within it, such as a relative when the labelled person is cropped out or not re-detected, can take the label."
enforced_at = [
    "core/faces.cpp:carry_labels",
    "core/faces.cpp:same_frame",
    "core/faces.cpp:face_provenance",
    "core/scan_engine.cpp:ScanEngine::run_workers",
    "core/faces_engine.cpp:FacesEngine::run",
    "core/faces.cpp:trusted_row_sha",
]
binds = ["faces.rebuild"]
protects = ["user-metadata"]
tests = [
    "CarryLabels.SameModelNeverMovesALabelToAnotherPersonsFace",
    "CarryLabels.AModelChangeInASameSizedRotatedFrameDropsRatherThanMoves",
    "CarryLabels.AModelChangeInA180RotatedFrameDropsRatherThanMoves",
    "CarryLabels.ARowFromBeforeV10IsTakenAsTheSfaceModelWithAnUnknownFrame",
    "CarryLabels.AnEmbeddingMatchAndAnOverlapMatchShareOneDetection",
    "CarryLabels.SameModelOneDetectionTakesAtMostOneLabel",
    "CarryLabels.AnEmbeddingBeyondTheThresholdDoesNotMatch",
    "CarryLabels.TheEmbeddingThresholdIsAppliedToNormalizedDistance",
    "FacesEngineRun.RebuildDropsALabelFromAnotherModelInAnotherFrame",
    "FacesEngineRun.RebuildDropsALabelWhenTheFileChangedUnderItsRowAndTheModelChanged",
]
test_kind = "witness"
status = "holds"
test_gap = "The rotated-frame cases are unit tests over synthetic embeddings; no engine test rotates a real image, because the detector does not find faces turned 90 degrees reliably. The stale-row check trusts mtime and size like scan's skip, so a file rewritten with identical mtime and size passes as unchanged. The embedding threshold is SFace's published value, not one measured on phig's data, and a same-model match is a biometric threshold: a lookalike within it can take a label, and no test exercises that. Frame identity is bytes plus size, not decoder: the same JPEG decoded under OpenCV 4.x and 5.x can orient differently when its first APP1 is XMP, so under a model change across such an OpenCV upgrade the overlap pass could compare differently oriented boxes. The engine witnesses skip without the face path, so ubuntu-26.04 is the only CI leg that runs them."

[[rule]]
id = "R89"
tier = "engine"
concern = "metadata"
statement = "A file phig copies, or moves across filesystems, keeps its source's modification time."
rationale = "For a photo with no EXIF or sidecar date, mtime is the date organize files it under and search shows. A copy that took the time it was made misdates every such photo, and does so late: the copied row keeps the old modified_at, so the damage appears only when the next scan adopts the file's new mtime. The time is set on the temporary file before the rename publishes it, so the file never appears at its destination with the wrong one."
enforced_at = ["core/paths.cpp:copy_mtime", "core/paths.cpp:atomic_copy_file", "core/paths.cpp:move_file"]
binds = ["organize.copy", "organize.move", "remove.trash"]
protects = ["original-file"]
tests = [
    "AtomicWriteTest.CopyFileKeepsSourceMtime",
    "MoveFileTest.CrossDeviceKeepsSourceMtime",
    "OrganizeEngineTest.CliCopyKeepsAnUndatedPhotosMtimeThroughARescan",
    "OrganizeEngineTest.CliCrossDeviceMoveKeepsAnUndatedPhotosMtimeThroughARescan",
]
test_kind = "witness"
status = "holds"
test_gap = "The two cross-device tests skip unless /dev/shm is a different filesystem from the temp directory. A trash move across filesystems reaches the same move_file branch and is not tested on its own. atime is not kept, and a destination filesystem with coarser timestamps (FAT's two seconds) rounds the time; neither is tested."

[[rule]]
id = "R92"
tier = "engine"
concern = "metadata"
statement = "A destination holding the source's bytes absorbs the source only when nothing the source carries would be lost; two different galleries, named faces on the source when the destination already has faces, or an attachment whose counterpart at the destination has different bytes leave the item to the run's conflict policy."
rationale = "Absorbing a move trashes the source and merges its row through R37, which keeps the target's gallery and moves faces only onto a target with none. In those cases the source's gallery or its person labels would disappear, and a sidecar with different content is user data the destination does not have. Falling back to the policy keeps both files, which is what organize did before identical content was recognized."
enforced_at = ["core/organize_exec.cpp:metadata_merge_blocker", "core/organize_exec.cpp:attachments_mergeable", "core/organize_engine.cpp:identical_occupant"]
binds = ["organize.copy", "organize.move", "organize.plan"]
protects = ["user-metadata", "attachment"]
tests = [
    "OrganizeIdenticalTest.DifferentGalleriesFallBackToTheConflictPolicy",
    "OrganizeIdenticalTest.NamedFacesOnTheSourceAndFacesOnTheDestFallBack",
    "OrganizeIdenticalTest.ASidecarWithDifferentBytesAtTheDestinationFallsBack",
]
test_kind = "witness"
status = "holds"
test_gap = "apply() repeats the checks before acting, but only a gallery changed between plan and apply on a copy is tested; no test changes a face or a sidecar in that window, or anything before a move."

[[rule]]
id = "R93"
tier = "engine"
concern = "metadata"
statement = "When a move absorbs its source into a destination with the same bytes, or resolving duplicates keeps one file of a group, the file kept takes another copy's modification time only when both are dated by their mtime and the other's is older and plausible, on or after 1990-01-01 and not in the future; the surviving row records the kept file's final mtime, and a changed time is logged with the one it replaced."
rationale = "A copy takes the time it was made, so of two identical files the older mtime is usually the original's, and for a photo with no EXIF or sidecar date that time is its date. A photo dated by EXIF or a sidecar does not depend on its mtime, so it is left alone. Times before 1990 are the Unix epoch, the FAT default of 1980-01-01, or an unset clock, and would misdate the photo worse than the copy time."
enforced_at = ["core/organize_exec.cpp:mtime_to_keep", "core/organize_exec.cpp:execute_identical_action", "core/duplicates_resolve.cpp:resolve_group"]
binds = ["organize.move", "duplicates.resolve"]
protects = ["original-file", "db-row"]
tests = [
    "OrganizeIdenticalMtimeTest.AnUndatedDestinationTakesTheSourcesOlderMtime",
    "OrganizeIdenticalMtimeTest.ANewerSourceMtimeIsNotTaken",
    "OrganizeIdenticalMtimeTest.ImplausibleSourceTimesAreIgnored",
    "OrganizeIdenticalMtimeTest.AnExifDatedDestinationKeepsItsMtime",
    "DuplicatesResolveTest.AnUndatedKeeperTakesTheOldestPlausibleMtimeInTheGroup",
]
test_kind = "witness"
status = "holds"
test_gap = "A sidecar-dated pair is not tested; the EXIF case reaches the same branch. The logged previous time has one-second resolution, so restoring it from the log loses the fraction."

[[rule]]
id = "R96"
tier = "engine"
concern = "metadata"
statement = "A duplicate group is resolved only when every removed member's user metadata and attachments can be carried to the file kept; two different galleries, named faces the kept file cannot take, or an attachment that differs from the one beside the kept file leave the whole group as it is."
rationale = "Each removed member's row is merged through R37, which keeps the target's gallery and moves faces only onto a target with none, so in those cases the merge would drop a gallery or a person label. A sidecar with different contents is user data the kept file does not have. Leaving the group keeps every copy; the plan names the reason so a person can decide."
enforced_at = ["core/duplicates_resolve.cpp:check_group"]
binds = ["duplicates.resolve"]
protects = ["user-metadata", "attachment"]
tests = [
    "DuplicatesResolveTest.DifferentGalleriesLeaveTheGroupAlone",
    "DuplicatesResolveTest.NamedFacesThatCannotMoveLeaveTheGroupAlone",
    "DuplicatesResolveTest.ADifferentSidecarBesideTheKeeperLeavesTheGroupAlone",
    "DuplicatesResolveTest.AResolvedGroupLeavesOneFileAndCarriesTheMetadata",
    "DuplicatesResolveTest.ARemovedMembersSidecarIsCarriedToTheKeeper",
]
test_kind = "witness"
status = "holds"
test_gap = "Two removed members carrying different sidecars to the same name beside the kept file reach the same check and are not tested. apply() repeats the check, but no test changes a gallery or a face between plan and apply."

[[rule]]
id = "R100"
tier = "engine"
concern = "metadata"
statement = "A copy's row carries the original's tags, favorite, gallery and faces, and a copy onto a tracked file holding the same bytes merges them into that row by R37's rules without moving anything off the original."
rationale = "Tags, favorites, galleries and faces exist only in the catalog, so a copy that left them behind would arrive bare and the user's work would survive only on the original. Copying is the safe way to reorganize, because the originals stay untouched until the result is checked, which makes the copy the row the user goes on to keep. The faces are new rows with their own vec_faces entries rather than shared ones, so renaming or removing the copy's face never reaches the original's. The metadata commits in the transaction that inserts the copy's row, so a copy whose metadata cannot be written is rolled back with its file. A merge into a tracked row keeps the target's gallery and faces, which R92's blockers make safe: a gallery conflict, or named faces against existing faces, never reaches the merge."
enforced_at = [
    "core/database.cpp:Database::copy_user_metadata",
    "core/organize_exec.cpp:execute_organize_action",
    "core/organize_exec.cpp:execute_identical_action",
]
binds = ["organize.copy"]
protects = ["user-metadata"]
tests = [
    "OrganizeCopyMetadataTest.CopyCarriesTagsFavoriteGalleryAndFaces",
    "OrganizeCopyMetadataTest.RenamingTheCopysFaceLeavesTheOriginalsAlone",
    "OrganizeCopyMetadataTest.AFailedMetadataWriteRollsTheCopyBack",
    "OrganizeIdenticalTest.CopyOntoAnIdenticalUntrackedFileCarriesTheMetadata",
    "OrganizeIdenticalTest.CopyOntoAnIdenticalTrackedFileMergesTheMetadata",
    "OrganizeIdenticalTest.CopyOntoAnIdenticalTrackedFileWithFacesKeepsItsOwn",
    "OrganizeIdenticalTest.CopyFallsBackWhenAGalleryChangesBetweenPlanAndApply",
    "OrganizeEngineTest.CliCopyCarriesTagsAndGalleryToTheCopy",
]
test_kind = "witness"
status = "holds"
test_gap = "No test drives a copy through libphig, which runs the same executor. A face whose stored embedding is not 128 floats is copied with a zeroed embedding, untested."
