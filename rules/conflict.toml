[[rule]]
id = "R01"
tier = "engine"
concern = "conflict"
statement = "A protected destination is never overwritten under any on_conflict policy; the resolver renames around it."
rationale = "The protected set covers another image's not-yet-moved source and any real file the database does not track. Overwriting either destroys bytes phig cannot restore, so the guard outranks the policy the user asked for."
enforced_at = ["core/paths.cpp:resolve_conflict"]
binds = ["organize.copy", "organize.move", "organize.plan"]
protects = ["original-file"]
tests = ["OrganizeEngineTest.OverwritePolicyStillRenamesAroundAnExistingFile"]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R02"
tier = "engine"
concern = "conflict"
statement = "A move to an occupied destination fails rather than replacing what is there, whatever the conflict policy decided."
rationale = "This guard sits below the planner and answers a question the plan cannot: a file that appeared at the destination after planning, from a concurrent phig run or a sync app. It uses the kernel's atomic no-replace rename where one exists, then a hard-link emulation, so the check and the rename are one operation rather than two."
enforced_at = ["core/paths.cpp:move_file", "core/paths.cpp:rename_noreplace"]
binds = ["organize.move", "remove.trash"]
protects = ["original-file", "attachment"]
tests = [
    "MoveFileTest.RefusesToOverwriteExistingDest",
    "MoveFileTest.CrossDeviceRefusesToOverwriteExistingDest",
    "OrganizeExecTest.MoveRefusesAnOccupiedDestinationWithoutAuthorization",
    "RemoveExecTest.TrashTwoSameNameFilesGetDistinctPathsNoClobberAndLogs",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R03"
tier = "engine"
concern = "conflict"
statement = "A destination already claimed by an earlier file in the same run is a conflict even when nothing occupies it on disk."
rationale = "Two selected files can expand to one destination under the same format string. The first has not been written yet when the second is resolved, so no on-disk check can see the collision; only the claimed set can."
enforced_at = ["core/paths.cpp:resolve_conflict"]
binds = ["organize.copy", "organize.move", "organize.plan"]
protects = ["original-file"]
tests = [
    "ResolveConflictTest.IntraRunCollisionRenameKeepsBoth",
    "ResolveConflictTest.IntraRunCollisionSkipDropsSecond",
    "ResolveConflictTest.IntraRunCollisionOverwriteRenamesSecond",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R05"
tier = "engine"
concern = "conflict"
statement = "The copy branch renames an occupied destination aside before writing and puts it back if any step fails."
rationale = "Defense in depth: the planner protects every existing on-disk path, so in normal use the destination is free, and this covers any caller that targets an occupied one anyway. The backup is a same-directory rename rather than a byte copy, so every failure path can restore it, and a failed restore is thrown rather than swallowed because the original then sits only at the backup path."
enforced_at = ["core/organize_exec.cpp:execute_organize_action", "core/paths.cpp:unique_backup_path"]
binds = ["organize.copy"]
protects = ["original-file"]
tests = [
    "OrganizeExecTest.CopyRestoresPriorFileOnDbFailureOverwrite",
    "OrganizeExecTest.CopyOverwriteSuccessLeavesNoBackup",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R06"
tier = "engine"
concern = "conflict"
statement = "An authorized replace renames the occupant aside before the move and restores it if any later step fails."
rationale = "move_file refuses to overwrite, so an occupied destination has to be cleared before the rename can succeed; doing it with a same-directory rename means the disk action, the path update and the log entry can all be undone. The backup is removed only after the transaction commits, which is the point at which the replacement the caller authorized has actually happened."
enforced_at = ["core/organize_exec.cpp:execute_organize_action"]
binds = ["organize.move"]
protects = ["original-file"]
tests = [
    "OrganizeExecTest.MoveRestoresPriorFileOnDbFailureWhenOverwriteAllowed",
    "OrganizeExecTest.MoveOverwriteSuccessLeavesNoBackup",
    "AbiOrganizeTest.OverriddenOverwriteReplacesAnUntrackedOccupant",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R08"
tier = "engine"
concern = "conflict"
statement = "A run started with on_conflict overwrite replaces the file at an occupied destination."
rationale = "The flag offers three values and the code has two behaviors. The planner's is_protected returns true for any path that exists on disk and resolve_conflict renames around a protected destination, so a run-level overwrite differs from rename only on an intra-run collision. A user who asks to replace a file gets a renamed copy instead and is not told. R01 records the guard that produces this and is correct on its own terms; what is wrong is that the policy name promises something the guard never allows."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::plan", "core/paths.cpp:resolve_conflict"]
binds = ["organize.copy", "organize.move", "organize.plan"]
protects = ["original-file"]
tests = ["OrganizeEngineTest.OverwritePolicyStillRenamesAroundAnExistingFile"]
test_kind = "witness"
status = "violated"
test_gap = "The listed test pins today's contrary behavior, which is the regression test plan 042 wanted. Nothing tests the statement, because no code path implements it. Plan 059 decides whether the policy changes or the flag does."

[[rule]]
id = "R09"
tier = "engine"
concern = "conflict"
statement = "An explicit per-item override may replace a file that exists on disk, but never another image's not-yet-moved source."
rationale = "An override is the caller answering a conflict the plan showed, which is the opposite of the silent loss the on-disk arm of the guard exists to stop, so that arm is bypassed. A batch source is a tracked original phig is in the middle of relocating; no caller intent makes destroying it correct, so an override that lands on one is refused rather than honored."
enforced_at = [
    "core/organize_engine.cpp:OrganizePlan::set_resolution",
    "core/organize_engine.h:OrganizePlan::set_resolution",
]
binds = ["organize.copy", "organize.move"]
protects = ["original-file"]
tests = [
    "OrganizeEngineTest.SetResolutionRefusesToTargetABatchSource",
    "OrganizeEngineTest.ApplyHonorsAnOverrideAgainstAFileThatStillExists",
    "OrganizeEngineTest.CopyHonorsAPerItemOverrideToo",
    "AbiOrganizeTest.OverriddenOverwriteReplacesAnUntrackedOccupant",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R10"
tier = "engine"
concern = "conflict"
statement = "A destination that became occupied between plan and apply is skipped, never re-resolved to a name the caller was not shown."
rationale = "Re-running the resolver at execution time could file the photo under a name that appeared in no plan, which defeats the point of authorizing one. Skipping keeps the outcome a subset of what was shown, and the item lands in the skipped count so the caller can re-plan and see the new conflict. An item carrying an explicit override is exempt, because that override is the authority to replace what is there."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::apply"]
binds = ["organize.copy", "organize.move"]
protects = ["original-file"]
tests = [
    "OrganizeEngineTest.ApplySkipsAnItemWhoseDestinationBecameOccupied",
    "OrganizeEngineTest.ADestinationThatBecameFreeIsSimplyWritten",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R11"
tier = "engine"
concern = "conflict"
statement = "A file whose resolved destination is its own path is left alone: nothing is written and nothing is logged, a resolution only the overwrite policy produces."
rationale = "resolve_conflict's occupancy test has no self-exemption, so a file already sitting at its destination reads as taken and never takes the free-path branch. Only the overwrite arm then returns the path unchanged, because the is_protected predicates do exempt a file's own source; under rename the resolver falls into the suffix loop and files the photo beside itself under a _1 name, and under skip it returns empty. On the path that does reach the executor the guard is what stops a move renaming a file onto itself and logging a meaningless entry, and stops the copy branch running its backup-then-copy dance against the very file it is copying."
enforced_at = ["core/organize_exec.cpp:execute_organize_action"]
binds = ["organize.copy", "organize.move"]
protects = ["original-file", "activity-log"]
tests = [
    "OrganizeExecTest.NoOpSelfMoveDoesNothingAndLogsNothing",
    "OrganizeExecTest.NoOpSelfCopyDoesNotCorruptFile",
    "ResolveConflictTest.SelfSourceNotProtected",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R90"
tier = "engine"
concern = "conflict"
statement = "A destination that already holds the source's bytes, on disk or from an earlier item in the same run, is not a conflict under any on_conflict policy: a copy writes no file and gives the destination's row the source's user metadata (R100), and a move sends the source to the trash after carrying its user metadata to the destination's row."
rationale = "Renaming around identical content writes a second copy of the same bytes under a _1 name, and skipping leaves the duplicate where it was, so merging two copies of a collection multiplied its duplicates. A copy that adopts an untracked identical file is logged as adopt rather than copy, because undoing a copy deletes the file it wrote and phig wrote none."
enforced_at = ["core/organize_engine.cpp:identical_occupant", "core/organize_engine.cpp:OrganizeEngine::apply", "core/organize_exec.cpp:execute_identical_action"]
binds = ["organize.copy", "organize.move", "organize.plan"]
protects = ["original-file", "user-metadata"]
tests = [
    "OrganizeIdenticalTest.MoveOntoAnIdenticalUntrackedFileTrashesTheSourceAndAdoptsTheDest",
    "OrganizeIdenticalTest.MoveOntoAnIdenticalTrackedFileCarriesMetadataAndDropsTheSourceRow",
    "OrganizeIdenticalTest.TwoIdenticalSourcesPlannedToOneDestinationLeaveOneFile",
    "OrganizeIdenticalTest.WhenTheFirstOfTwoIdenticalSourcesFailsTheSecondMovesNormally",
    "OrganizeIdenticalTest.AMissingSidecarIsCarriedAndAnIdenticalOneIsTrashed",
    "OrganizeIdenticalTest.CopyOntoAnIdenticalUntrackedFileWritesNothingAndTracksIt",
    "OrganizeIdenticalTest.CopyOntoAnIdenticalTrackedFileMergesTheMetadata",
    "AbiOrganizeTest.AnIdenticalDestinationIsReportedAndAMoveTrashesTheSource",
]
test_kind = "witness"
status = "holds"
test_gap = "Only the skip and rename policies are exercised; overwrite reaches the same branch. A RAW's attached JPEG and a Live Photo video go through the same attachment list as a sidecar and are not tested here."

[[rule]]
id = "R91"
tier = "engine"
concern = "conflict"
statement = "A source is trashed as identical to its destination only after the two files, and their attachments, are compared byte for byte on disk when the move runs; an item that no longer matches is skipped."
rationale = "The plan compares the source row's recorded sha256 and is advisory. Trashing the source is the one step here that removes a file from where the user keeps it, so it rests on what is on disk at that moment, not on a hash that may be stale or a plan computed before an edit."
enforced_at = ["core/organize_exec.cpp:execute_identical_action", "core/organize_exec.cpp:same_bytes"]
binds = ["organize.move"]
protects = ["original-file"]
tests = ["OrganizeIdenticalTest.ASourceEditedAfterPlanningIsSkippedNotTrashed"]
test_kind = "witness"
status = "holds"
test_gap = "A destination edited between plan and apply, and an attachment that changes in that window, reach the same comparison and are not tested on their own."
