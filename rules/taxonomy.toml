# The nine concern classes. These are the columns of rules/by-operation.md.
concerns = [
    "conflict",         # destination occupied
    "reconcile",        # file gone, stale row, mount guard
    "atomicity",        # transaction boundaries, reachable interrupted states
    "recoverability",   # activity log, restore snapshot, trash
    "metadata",         # preservation and transfer of user-authored data
    "attachments",      # sidecars, RAW+JPEG, Live Photo MOV
    "concurrency",      # lock-taking versus lock-free
    "cancellation",     # where a run may stop and what it leaves
    "authorization",    # dry-run, plan/apply, --yes, overridable decisions
]

# The seven assets. These are the rows of rules/by-asset.md, ordered by how
# bad the loss is to the collection. client-process sits last because it
# isn't collection data at all — the harm is to a caller's process, not to
# the photos.

[[asset]]
id = "user-metadata"
rebuildable = "no"
note = "Tags, favorites, gallery, face labels. The only collection asset nothing can reconstruct."

[[asset]]
id = "original-file"
rebuildable = "backup-only"
note = "The bytes on disk."

[[asset]]
id = "attachment"
rebuildable = "backup-only"
note = "Sidecar, paired JPEG, Live Photo MOV. Easier to orphan than an original."

[[asset]]
id = "db-row"
rebuildable = "rescan"
note = "Rebuilt by a rescan, except the user-metadata it carries."

[[asset]]
id = "activity-log"
rebuildable = "no"
note = "The record of what happened."

[[asset]]
id = "thumb-cache"
rebuildable = "yes"
note = "Present so its rules are visibly cheap, not to guard it."

[[asset]]
id = "client-process"
rebuildable = "no"
note = "A foreign caller's address space and its ability to keep running against this library. phig can corrupt it (a struct that grew under an older header), mislead it (an error read on the wrong thread), or lock it out (a soname change). None is repairable from phig's side."
