# tier = "boundary" rules: they live at an interface rather than inside a core/
# primitive, so they carry binds_surface instead of binds. Grouped by tier
# rather than by concern, which is why this file holds several concerns.

[[rule]]
id = "R62"
tier = "boundary"
concern = "atomicity"
statement = "No C++ exception crosses an ABI entry point."
rationale = "Where a phig_ctx* is in scope the body is wrapped in PHIG_TRY/PHIG_CATCH, which converts an exception into a status plus a thread-local message: LockBusy to PHIG_ERR_BUSY, any other std::exception to PHIG_ERR_DB, anything else to PHIG_ERR_INTERNAL. PHIG_TRY expands to a null check on ctx, so the ctx-less entry points cannot use it and wrap their bodies in a plain try/catch(...) instead — phig_init does, and so do twelve of settings.cpp's thirteen. The exception is phig_settings_free, a bare { delete s; } with no handler, counted below among the 39. The hole is the entry points that return something other than phig_status. Scripted over phig.h's 69 PHIG_API declarations, 39 have no handler of their own. Most are trivially non-throwing accessors, or delegate to a wrapped helper — phig_op_copy_start and phig_op_move_start both call start_apply, which uses PHIG_TRY. But phig_query_add_tag push_backs a std::string, the ten phig_query_set_* functions assign one, and phig_op_poll copies the path and error strings, so each can throw std::bad_alloc into a C caller with no way to catch it. No plan states this."
enforced_at = [
    "libphig/internal.h:PHIG_TRY",
    "libphig/internal.h:PHIG_CATCH",
    "libphig/context.cpp:phig_init",
]
binds_surface = ["abi"]
# db-row comes from the general statement, not from the enumerated hole: an
# exception escaping a wrapped mutation would abort a caller mid-write, while
# every entry point in the 39 is a parameter, accessor or free path that
# touches no row. client-process is what the enumerated hole endangers: an
# exception leaving a C entry point ends the caller's process outright.
protects = ["db-row", "client-process"]
tests = [
    "AbiOperations.FailedOperationReportsItsMessageAndRefusesAResult",
    "AbiMutate.EachThreadSeesOnlyItsOwnError",
    "Abi.InitFailsOnUnopenableDatabase",
]
test_kind = "witness"
status = "partial"
test_gap = "The listed tests show a thrown exception arriving as a status and a message on the wrapped paths. Nothing exercises an unwrapped entry point under allocation failure, which is the only way to reach the hole, and nothing enumerates the entry points to check each has a handler — the count of 39 came from a script run while writing this record, not from a gate."

[[rule]]
id = "R63"
tier = "boundary"
concern = "concurrency"
statement = "phig_last_error returns the calling thread's own last message, and only until that thread's next ABI call."
rationale = "The storage is a function-local static thread_local std::string; PHIG_TRY clears it on entry and PHIG_CATCH sets it, so a later success on that thread wipes the message and a failure on another thread never appears in it. That is what lets a client drive one phig_ctx from several threads and still attribute an error to the call that produced it, which the handle-plus-poll operation model makes routine. The ctx argument is checked for null and otherwise ignored: the message is per-thread, not per-context, so two contexts used on one thread share the slot."
enforced_at = [
    "libphig/context.cpp:phig_thread_last_error",
    "libphig/context.cpp:phig_last_error",
    "libphig/internal.h:PHIG_TRY",
]
binds_surface = ["abi"]
protects = ["client-process"]
tests = ["AbiMutate.EachThreadSeesOnlyItsOwnError", "Abi.LastErrorOnNullCtxReturnsEmptyString"]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R64"
tier = "boundary"
concern = "atomicity"
statement = "Adding a symbol bumps PHIG_ABI_VERSION_MINOR and the CMake VERSION, and never SOVERSION."
rationale = "SOVERSION is the major alone, so an additive, backward-compatible change keeps the soname and existing callers need no rebuild; only an incompatible change bumps SOVERSION and MAJOR. The two numbers are hand-maintained in two files and agree today — phig.h has MAJOR 1 and MINOR 3, libphig/CMakeLists.txt has VERSION 1.3.0 and SOVERSION 1, with a comment there saying it must track the header. CI compares them on every push: scripts/rules.py's check_abi_version reads MAJOR and MINOR out of the header and VERSION and SOVERSION out of the CMake file and fails when the three disagree, which phig_abi_version() cannot do — it packs the two header macros together, so a test comparing it to the header cannot see that either has drifted from the CMake value. What no check reaches is the trigger. Adding a symbol needs no edit to the export lists, which match on the phig_ prefix rather than on a list of names, so a new entry point ships exported with both numbers untouched and every comparison still agreeing. The version bump is the only manual step and therefore the only one that can be forgotten."
enforced_at = [
    "libphig/include/phig/phig.h:PHIG_ABI_VERSION_MINOR",
    "libphig/CMakeLists.txt:SOVERSION",
]
binds_surface = ["abi"]
protects = ["client-process"]
tests = ["Abi.VersionMajorMatchesHeader", "Abi.ExportedSymbolCountMatchesTheRecordedAbiVersion"]
test_kind = "conformance"
status = "holds"
test_gap = "The trigger is now asked for. ExportedSymbolCountMatchesTheRecordedAbiVersion parses the header for its lines beginning PHIG_API, counts the phig_-prefixed names declared on them, and compares that to the row kAbiSymbolCounts records for the version the header currently claims. Measured by adding a PHIG_API void phig_break_the_pin(void); to the header: '70 exported symbols and ABI 1.3 was recorded with 69'. What stays open is that a count is not a set. Removing one symbol in the same commit that adds another leaves it at 69 and passes, which is a MAJOR break slipping through a test written for the MINOR one. And the test says only that the header and the table agree, so falsifying the row for the current version satisfies it as surely as bumping does — nothing can distinguish those two edits, which is the same limit check_abi_version has against VERSION and SOVERSION. VersionMajorMatchesHeader remains what it was: phig_abi_version()'s high half against PHIG_ABI_VERSION_MAJOR, a property of one expression that would pass with the CMake numbers set to anything at all."

[[rule]]
id = "R65"
tier = "boundary"
concern = "atomicity"
statement = "phig_op_progress gains no field: a new counter means a new struct and a new poll symbol."
rationale = "The struct is caller-allocated and filled by phig_op_poll, with no size and no version member, so a client built against an older header would have a newer libphig.so write past the end of its buffer — corruption the client cannot detect, not an error it can check for. phig_op_progress2 with phig_op_poll2 is the additive answer and keeps the soname. Adding a size member to the existing struct is the cleaner fix and is free only while nothing outside the repo links libphig (plan 040); that window shuts the moment a client ships against it. The neighbouring enums do have the provision the struct lacks — phig_op_stage is append-only and never renumbered, and tests/test_libphig_c_compile.c pins every phig_status, phig_op_state and phig_op_stage value with a negative-width bitfield so a renumber fails the build. The struct has no equivalent pin: nothing asserts its size or its field order."
enforced_at = ["libphig/include/phig/phig.h:phig_op_progress"]
binds_surface = ["abi"]
protects = ["client-process"]
tests = ["Abi.OpProgressGainsNoField"]
test_kind = "conformance"
status = "holds"
test_gap = "The struct now has the pin the rationale says it lacks, in two places. tests/test_libphig_c_compile.c fixes the whole layout with negative-width bitfields — every field's offset against the one before it, `done`'s against the enum size rounded up to alignof(uint64_t), and sizeof against the last field's offset — so a field added anywhere fails the build as C99. Measured: appending a uint64_t gives \"bit-field 'size' has negative width (-1)\", and inserting one before `processed` gives the same on 'processed'. Abi.OpProgressGainsNoField asserts the same layout at runtime, which is what gives the rule a name check 2 can see pass. One field can still be added without either noticing: a uint32_t between `stage` and `done` lands in the padding, so it changes no offset and no size. Measured — both pins pass with it in place. It is also the one addition the rationale's harm does not reach, since an older client's buffer is still the right size and every field it reads is where it was; a fifth counter, which is what the statement is about, cannot fit there."

[[rule]]
id = "R66"
tier = "boundary"
concern = "authorization"
statement = "A destructive ABI operation is authorized by a plan the caller inspects and then applies with a second call, never by a callback the engine invokes mid-run."
rationale = "No ABI entry point takes a confirmation callback and none can: no callback may run on an engine thread under the handle-plus-poll model, and a callback has no meaning over the wire protocol plan 052 designs, where nothing can call back into a browser mid-request. cmd_rm's ConfirmFn is a cli/ affordance for a command with no plan phase, not a model to copy. Organize is the worked example and carries all three properties the shape is meant to bring: the plan is a caller-owned value that phig_op_organize_plan_take copies out and the caller frees, so it outlives the operation that computed it and start_apply snapshots it again on the way in; apply re-verifies every decision at execution time, so a stale plan cannot cause an action the re-check would not independently justify; and which decisions are overridable is a property of the decision type rather than of the mechanism (R59). The gap is faces: phig_op_faces_start is destructive — operations.toml marks faces.rebuild so, and R60 measures what it destroys — and it has no plan phase, so the one ABI operation that deletes user-authored metadata is the one with no authorization step. Remove and reconcile are not counterexamples: neither is reachable through the ABI yet, which 053 and 041 own."
enforced_at = [
    "libphig/organize.cpp:phig_op_organize_plan_take",
    "libphig/organize.cpp:start_apply",
    "core/organize_engine.cpp:OrganizeEngine::apply",
]
binds_surface = ["abi"]
protects = ["original-file", "user-metadata", "db-row"]
tests = [
    "AbiOrganizeTest.PlanStaysUsableAfterTheOperationIsFreed",
    "AbiOrganizeTest.PlanMayBeFreedImmediatelyAfterApplyStarts",
    "AbiOrganizeTest.MoveAppliesThePlanAndTheSourceIsGone",
    "AbiOrganizeTest.OverriddenOverwriteReplacesAnUntrackedOccupant",
]
test_kind = "conformance"
status = "partial"
test_gap = "Every listed test is organize. Nothing asserts the negative — that no entry point takes a callback — and nothing covers faces, whose missing plan phase is why this is partial rather than holds."

[[rule]]
id = "R67"
tier = "boundary"
concern = "cancellation"
statement = "phig_op_free joins the operation's worker rather than detaching it, so no engine thread outlives the handle or the Database it writes through."
rationale = "The worker holds raw pointers to the phig_op and to the per-operation Database the handle owns, so returning while it still runs would leave it writing through freed memory — a use-after-free onto a live SQLite connection, which is the shape of corruption a client can neither see nor recover from. Joining makes phig_op_free block for as long as the item in flight takes; a caller that does not want to wait calls phig_op_cancel first, and cancellation lands between items (R57), so the wait is bounded by one item rather than by the run. phig_op_wait is the same join without the free."
enforced_at = ["libphig/operations.cpp:phig_op_free", "libphig/operations.cpp:phig_op_wait"]
binds_surface = ["abi"]
protects = ["db-row"]
tests = [
    "AbiOperations.FreeWhileRunningWaitsForTheWorker",
    "AbiOperations.CancelIsIdempotentAndSafeAfterCompletion",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R69"
tier = "boundary"
concern = "conflict"
statement = "Writing a command's results to the path named by --output does not destroy what is already at that path."
rationale = "Results are rendered into a buffer and written through write_output_file, which creates a temporary sibling with O_CREAT | O_EXCL | O_NOFOLLOW and renames it into place, so the path never holds a partial file and a symlink planted at the temp's name is never written through. The parent directory must exist: none is created. The rename refuses an occupied path, a symlink included (dangling or not), unless --overwrite was given; with it the rename replaces the link itself and never the file it points at. cmd_duplicates and all three branches of cmd_search (person, face, general) go through one ResultSink, and fav list reaches cmd_search, so no site opens the path itself. --count with --output and --overwrite without --output are refused before any work is done, as flags that would do nothing. cmd_search and cmd_duplicates also refuse an occupied path before the search runs, to save the work; the refusal in write_output_file is the one that holds. Every other write phig makes refuses an occupied destination (R01, R02, R41), and this one now does too. Libphig returns records and leaves the writing to its caller, so the write and its guard live in core/paths.cpp for any surface that renders results to a file."
enforced_at = ["core/paths.cpp:write_output_file"]
binds_surface = ["cli"]
# The bytes destroyed are on disk and irreplaceable, which is what
# original-file names, but they sit outside the collection: no row points at
# them, no rescan rebuilds them, and phig was given the path only as somewhere
# to write. Recorded under original-file rather than an eighth asset so the
# by-asset row a reader consults for 'what can destroy a file' holds every rule
# that can; the strain is that every other rule in that row means tracked media.
protects = ["original-file"]
tests = [
    "CliOutputTest.OutputRefusesAnOccupiedPath",
    "CliOutputTest.OutputOverwriteReplacesTheFile",
    "CliOutputTest.OutputCreatesAMissingFile",
    "CliOutputTest.OutputOverwriteReplacesASymlinkNotItsTarget",
    "CliOutputTest.OutputRefusesADanglingSymlink",
    "CliOutputTest.CountWithOutputIsAnError",
    "CliOutputTest.OverwriteWithoutOutputIsAnError",
    "PathsTest.WriteOutputFileCreatesAMissingFile",
    "PathsTest.WriteOutputFileRefusesAnExistingFile",
    "PathsTest.WriteOutputFileRefusesADanglingSymlink",
    "PathsTest.WriteOutputFileReplacesASymlinkNotItsTarget",
    "PathsTest.WriteOutputFileReplacesAnExistingFileWhenAsked",
    "PathsTest.WriteOutputFileFailsWhenTheParentIsMissing",
    "PathsTest.WriteOutputFileNeverWritesThroughAPlantedTemp",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The face-search branch of cmd_search has no subprocess test, because a face search needs the models and a detectable face. It writes through the same ResultSink as the three tested sites."

[[rule]]
id = "R70"
tier = "boundary"
concern = "authorization"
statement = "A command that only reads a collection neither creates its database nor migrates its schema."
rationale = "open_catalog_db is the one open policy. Read opens read-only, so it can neither create the file nor migrate it, and it refuses a missing database and any schema version other than this build's with a CatalogError naming the catalog. Write and Create migrate; only Create makes a missing database. So of the commands that write, only scan and libphig's read-write context create a missing catalog; every other write opens with Write, or calls require_catalog before taking its lock, and refuses a missing catalog without creating its directory. Which access a command passes is decided at its call site: every CLI command that only reads, including the dry runs of rm, cp, mv and thumbs clean, passes Read. libphig's read-only context passes Read too, through open_catalog_db, so it refuses a missing database or another schema version the same way. A migration is forward-only and init_schema refuses a database newer than the build, so a read that migrated would make the catalog unopenable by an older phig on another machine. A read that created would turn a mistyped catalog path into an empty catalog reported as empty. The refusal of a newer catalog also covers a concurrent upgrade: another build can upgrade past this one between open_catalog_db's read and init_schema's transactions, a window the pre-upgrade copy widens, and every step and schema path then finds its version already reached and skips. init_schema therefore re-reads the version where every path ends and throws SchemaNewerError, which open_catalog_db turns into the same CatalogError::Kind::Newer it raises for its own read, so this build never writes to a schema it does not know."
enforced_at = [
    "core/catalog.cpp:open_catalog_db",
    "libphig/context.cpp:phig_init",
    "core/database.cpp:refuse_if_newer",
]
binds_surface = ["cli"]
# db-row is the whole exposure: the migration rewrites the tables rows live in
# and moves the file past what an older build will open, and a created database
# is a collection of rows that did not exist. Nothing here deletes a file or a
# log entry, so original-file and activity-log stay off.
protects = ["db-row"]
tests = [
    "OpenCatalogTest.ReadAndWriteRefuseAMissingCatalogAndCreateNothing",
    "OpenCatalogTest.ReadRefusesAnOutdatedCatalogAndLeavesItsVersion",
    "CatalogCliTest.ReadsRefuseAMissingCatalogAndCreateNothing",
    "CatalogCliTest.ReadsRefuseAnOutdatedCatalogAndLeaveItsVersion",
    "CatalogCliTest.WritesRefuseAMissingCatalogAndCreateNothing",
    "CatalogCliTest.ScanCreatesAMissingCatalog",
    "OpenCatalogTest.EveryAccessRefusesANewerCatalog",
    "SchemaUpgradeTest.AnUpgradeOvertakenByANewerBuildIsRefused",
    "SchemaUpgradeTest.AFreshSchemaOvertakenByANewerBuildIsRefusedAndNotRestamped",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The subprocess tests cover search, duplicates, the four list forms and the dry runs of cp, rm and thumbs clean, which the outdated-catalog test covers. On the write side they cover tag add, gallery set, fav add, rm, cp, trash empty, thumbs rebuild, thumbs clean, face rebuild and face identify refusing a missing catalog and creating nothing, and scan creating one. mv and the remaining tag, gallery and fav forms are read off cli/main.cpp's call sites rather than asserted one by one, and so is which access each remaining read passes."

[[rule]]
id = "R73"
tier = "boundary"
concern = "authorization"
statement = "Input an operation does not recognize, whether an unknown CLI flag or an option value outside its field's defined set, stops it before it changes anything."
rationale = "An unrecognized input that is skipped or defaulted widens what an operation acts on without anyone asking for it. The CLI case was measured: before face rebuild's flag loop had an else branch, `phig face rebuild --mtach '*a.jpg'` stepped over the typo and its value, left opts.matches empty, which selects every image (R74), and rebuilt both images of a two-image collection, dropping the label on a named face; with the else branch the same typo prints 'Unknown option: --mtach', exits 1, and the face row and its label are untouched. All thirteen of cli/main.cpp's flag loops now end that way. That guard is argv parsing, which only cli/ has, so the rule is enforced again below it for every surface: each engine's validate() throws InvalidOption before any work for a value outside its field's set (scan's media string and directory, a thumbnail size of zero or less, organize's empty destination or format, and a parallel above 256, or above the machine's core count where each worker loads its own ~150MB face detector), and libphig refuses an enum value outside its declaration (phig_config.mode, phig_index_options.media, on_conflict, a per-item resolution), a negative thumbnail size, and an id_count with a NULL ids array, returning PHIG_ERR_INVALID_ARG with *out NULL and the field named in phig_last_error. Before that, each of those was defaulted: an unknown mode opened the read-write path, which creates a missing catalog; an unknown media indexed everything; an unknown conflict policy became rename; an empty destination planned every path relative to the process's working directory."
enforced_at = [
    "core/scan_engine.cpp:validate",
    "core/thumbs_engine.cpp:validate",
    "core/organize_engine.cpp:validate",
    "core/faces_engine.cpp:validate",
    "libphig/context.cpp:phig_init",
    "libphig/operations.cpp:phig_op_index_start",
    "libphig/operations.cpp:phig_op_thumbs_start",
    "libphig/organize.cpp:from_abi",
    "libphig/internal.h:check_id_array",
]
binds_surface = ["cli", "abi"]
# user-metadata alone. Nothing here deletes a file or a row: the widened
# selection reaches faces.rebuild, which replaces face rows and drops the
# person labels on them, and leaves the images and their rows in place.
protects = ["user-metadata"]
tests = [
    "FacesEngineRun.CliRejectsAnUnknownFlagWithoutTouchingFaceData",
    "ScanEngine.AnUnknownMediaValueIsRefusedBeforeAnythingIsIndexed",
    "ThumbsEngineRun.ANonPositiveSizeIsRefusedBeforeAnythingIsGenerated",
    "OrganizeEngineTest.AnEmptyDestinationOrFormatIsRefusedBeforePlanning",
    "Abi.InitRejectsAnUnknownAccessModeWithoutCreatingTheCatalog",
    "AbiOperations.AnUnknownOptionValueIsRefusedBeforeTheOperationStarts",
    "AbiOrganizeTest.PlanRefusesAnUnknownPolicyAnEmptyDestinationAndAMissingIdArray",
    "AbiOrganizeTest.SetResolutionRefusesAnUnknownValueAndChangesNothing",
    "ScanEngine.AParallelAboveTheLimitIsRefusedBeforeAnythingIsIndexed",
    "ThumbsEngineRun.AParallelAboveTheLimitIsRefused",
    "FacesEngineRun.AParallelAboveTheCoreCountIsRefusedAndTouchesNoFace",
    "FacesEngineRun.CliRefusesAParallelAboveTheCoreCountWithoutTouchingFaceData",
    "AbiOperations.AParallelAboveTheLimitIsRefusedBeforeTheOperationStarts",
]
test_kind = "conformance"
status = "holds"
test_gap = "One CLI loop, one flag: the subprocess test runs `face rebuild --mtach` and skips when the binary is not beside phig-tests or at ./build/phig; the other twelve loops rest on measurement."

[[rule]]
id = "R81"
tier = "boundary"
concern = "conflict"
statement = "Staging a stdin query image does not destroy anything already on disk."
rationale = "search --similar - and search --face - read stdin into memory first, so empty stdin is refused before anything is created. The bytes are then written through write_private_temp_file, which creates the file with mkstemp in fs::temp_directory_path(): a unique name, O_EXCL, mode 0600. No existing path or symlink is opened, so nothing already on disk is truncated or written through, and concurrent stdin searches get different files. The CLI removes the staged file when the search ends, on every path including a thrown exception, through a destructor in cmd_search."
enforced_at = ["core/paths.cpp:write_private_temp_file"]
binds_surface = ["cli"]
# original-file for the same reason R69 gives: the bytes are on disk and
# irreplaceable but sit outside the collection, with no row pointing at them
# and no rescan able to rebuild them. Unlike R69, phig was not even given the
# path — it picked it.
protects = ["original-file"]
tests = [
    "CliOutputTest.StdinQueryNeverWritesThroughAPlantedPath",
    "CliOutputTest.EmptyStdinCreatesNothing",
    "PathsTest.PrivateTempFilesAreUniqueAndOwnerOnly",
    "PathsTest.PrivateTempFileNeverWritesThroughAPlantedSymlink",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The tests cannot plant a file at the name mkstemp will choose, so exclusivity rests on mkstemp's O_EXCL contract. The planted-symlink tests pin the old fixed name and that a fresh name is used."
