[[rule]]
id = "R12"
tier = "engine"
concern = "reconcile"
statement = "A tracked path is deletable only when its file is gone and its parent directory still exists; a missing parent and a failed existence check are reported apart from it and kept."
rationale = "A missing file alone does not say what happened. A missing parent directory usually means an unmounted or unreachable subtree rather than a deletion, and an existence check that errors says nothing at all. The three cases warrant different treatment, so the classifier returns them separately and leaves the judgement to the caller instead of collapsing them into one filtered list."
enforced_at = ["core/paths.cpp:paths_safe_to_delete"]
binds = ["scan.reconcile", "remove.orphans"]
protects = ["user-metadata", "db-row"]
tests = [
    "SafeToDeleteTest.PresentFilesAreNotDeletable",
    "SafeToDeleteTest.GenuinelyMissingFileWithPresentParentIsDeletable",
    "SafeToDeleteTest.MissingFileUnderAbsentParentIsKept",
    "SafeToDeleteTest.PartialUnmountKeepsUnmountedSubtreeDeletesRealMissing",
    "SafeToDeleteTest.UnreadableParentIsCheckFailedNotParentMissing",
]
test_kind = "conformance"
status = "holds"

[[rule]]
id = "R13"
tier = "engine"
concern = "reconcile"
statement = "A path whose existence could not be determined is never deleted, under any flag."
rationale = "An EACCES or EIO on the existence check is an unknown state, not a heuristic judgement about whether a drive is mounted. --ignore-mount-warning answers the mount question and has nothing to say about an unreadable path, so neither caller folds check_failed into what it deletes."
enforced_at = ["core/scan_engine.cpp:ScanEngine::run_reconcile", "core/remove_exec.cpp:cmd_rm"]
binds = ["scan.reconcile", "remove.orphans"]
protects = ["user-metadata", "db-row"]
tests = [
    "RemoveExecTest.RmOrphansNeverRemovesUnreadablePathsEvenWithIgnoreMountWarning",
    "SafeToDeleteTest.UnreadableParentIsCheckFailedNotParentMissing",
    "ScanEngine.ReconcileNeverDeletesARowWhoseExistenceCouldNotBeChecked",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R14"
tier = "engine"
concern = "reconcile"
statement = "--ignore-mount-warning means one thing wherever it appears: proceed past the mount heuristic, so a row whose parent directory is missing is deleted."
rationale = "One flag with two meanings is how a user learns a destructive command's behavior by accident. Plan 032 widened scan's existing flag rather than adding a second name to rm, so both callers fold parent_missing into the deletable set and neither overrides anything else."
enforced_at = ["core/scan_engine.cpp:ScanEngine::run_reconcile", "core/remove_exec.cpp:cmd_rm"]
binds = ["scan.reconcile", "remove.orphans"]
protects = ["user-metadata", "db-row"]
tests = [
    "RemoveExecTest.RmOrphansSkipsRowsWhoseParentIsMissingByDefault",
    "RemoveExecTest.RmOrphansRemovesMissingParentRowsWithIgnoreMountWarning",
    "RemoveExecTest.RmOrphansNeverRemovesPresentFilesEvenWithIgnoreMountWarning",
    "ScanEngine.IgnoreMountWarningDeletesRowsUnderAMissingParentOnScanToo",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R15"
tier = "engine"
concern = "reconcile"
statement = "Scan skips its whole destructive phase when every tracked row under the scanned directory classifies as deletable."
rationale = "An unmounted drive is indistinguishable from a deleted collection at the point reconcile runs, and losing a whole subtree's tags and faces to a forgotten mount is worse than leaving stale rows behind. The guard compares the deletable set against every row under the prefix, so it fires only when the two are the same size. A run that also has rows in parent_missing or check_failed does not trip it, and its deletable rows are deleted: those other rows are held by the per-row classifier of R12, not by this guard. The guard is coarse on purpose, and it names the flag that overrides it."
enforced_at = ["core/scan_engine.cpp:ScanEngine::run_reconcile"]
binds = ["scan.reconcile"]
protects = ["user-metadata", "db-row"]
tests = [
    "ScanEngine.MountLossGuardKeepsRowsWhenEveryFileVanishes",
    "ScanEngine.IgnoreMountWarningOverridesTheGuard",
    "ScanEngine.RemovesRowsForFilesThatDisappeared",
    "ScanEngine.MountLossGuardDoesNotFireWhenSomeRowsAreOnlyParentMissing",
]
test_kind = "witness"
status = "holds"
test_gap = "The mixed set now covered is deletable plus parent_missing: every tracked file is gone from disk, the guard does not fire, and the two deletable rows are deleted while the third survives. The rationale's other mixed shape is not covered — deletable rows alongside a check_failed one. ScanEngine.ReconcileNeverDeletesARowWhoseExistenceCouldNotBeChecked has nothing deletable, so it short-circuits on the guard's first condition instead of reaching the size comparison."

[[rule]]
id = "R16"
tier = "engine"
concern = "reconcile"
statement = "A stale row's user metadata transfers only when exactly one other tracked file with the same sha256 exists on disk; with none or several it transfers nowhere and the row is still deleted."
rationale = "With two identical-content files on disk phig cannot tell which one the user moved, and guessing would attach the tags to the wrong photo. The cost of refusing is real and is recorded rather than hidden: the row is deleted either way, and the restore snapshot captures neither tags nor faces, so ambiguity destroys them. Choosing a target is a feature nobody has designed, not an override of this rule."
enforced_at = ["core/relink.cpp:relink_moved_rows"]
binds = ["relink.transfer", "scan.reconcile"]
protects = ["user-metadata"]
tests = [
    "RelinkTest.SingleCandidateTransfersMetadata",
    "RelinkTest.AmbiguousCandidatesSkipped",
    "RelinkTest.NoCandidateDoesNothing",
    "RelinkTest.CandidateMissingOnDiskSkipped",
    "RelinkTest.MissingCandidateFileDoesNotCountTowardAmbiguity",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R17"
tier = "engine"
concern = "reconcile"
statement = "The has_sibling_raw and Live Photo peeks over indexed paths only decide whether to open a logged operation; the demote passes decide again, authoritatively, inside it."
rationale = "A peek is a read-only disk check made outside any transaction and from a path alone, so its answer can be stale before the work starts. demote_jpeg_rows re-derives the sibling RAW and requires it to be indexed, and demote_live_photo_rows re-runs pairing over the whole indexed set; both transfer metadata inside the transaction that commits the change. A false positive from a peek therefore costs an empty operation row rather than a wrong demotion."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/relink.cpp:demote_jpeg_rows",
    "core/relink.cpp:demote_live_photo_rows",
]
binds = ["scan.reconcile", "relink.demote", "relink.demote_live_photo"]
protects = ["user-metadata", "db-row"]
tests = [
    "RelinkTest.DemotesJpegToSameBasenameRaw",
    "RelinkTest.LoneJpegNotDemoted",
    "RelinkTest.JpegWithRawRowMissingNotDemoted",
    "RelinkTest.DeletedJpegWithIndexedRawNotDemoted",
    "LivePhotoDemotion.MovesTheVideoRowsMetadataToItsStillAndDropsTheRow",
    "LivePhotoDemotion.LeavesAnOrdinaryVideoRowAlone",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTarget",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTargetUnlogged",
    "ScanEngine.ReconcileOpensItsOperationForDemotableWorkAlone",
    "ScanEngine.ReconcileDemotesALivePhotoVideoRow",
]
test_kind = "witness"
status = "holds"
test_gap = "Both peeks are now driven with removed_paths empty and the only work demotable — the has_sibling_raw one over a JPEG beside an indexed RAW, the Live Photo one over a paired video row — so the block is no longer entered regardless of what they answer. What remains is the false positive the rationale names: a peek that says yes over work the demote pass then declines, a JPEG whose sibling RAW is on disk but not indexed. RelinkTest.JpegWithRawRowMissingNotDemoted pins the pass's refusal directly; nothing shows the empty operation row reconcile is left holding."

[[rule]]
id = "R75"
tier = "engine"
concern = "reconcile"
statement = "Which rows a scan deletes is decided by whether their files are on disk, never by which files that scan's flags admitted to the walk."
rationale = "run_reconcile takes its candidate set from db_.get_paths_with_prefix(scan_prefix) — every tracked row under the scanned directory — and classifies it with paths_safe_to_delete, which asks the filesystem. --recursive, --media and --hidden filter the walk instead (core/scan_engine.cpp:131-146) and reach none of that, so narrowing a scan cannot turn a row into a deletion candidate. That is worth stating because the opposite is the natural reading of the flags: a scan told to look at images only, in one directory only, still leaves every video and every subdirectory row alone. Measured with the built binary against a three-file collection (an image, a video, and an image in a subdirectory) scanned recursively: a following non-recursive `--media image` scan of the same directory reported Removed: 0 and left all three rows. The converse holds too, because the candidate set is the prefix rather than the walk — with the subdirectory's image then deleted from disk, a non-recursive `--media video` scan of the same directory reported Removed: 1 and dropped that row, a file the walk neither entered the directory for nor would have admitted. The prefix is where the containment argument sits: scanning a subdirectory reconciles that subtree and nothing above it."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/paths.cpp:paths_safe_to_delete",
]
binds = ["scan.reconcile"]
# db-row and the user-metadata it carries. No file is touched by reconcile —
# it deletes rows for files that are already gone.
protects = ["db-row", "user-metadata"]
tests = [
    "ScanEngine.MediaFilterExcludesTheOtherType",
    "ScanEngine.AMediaFilteredRescanKeepsTheOtherTypesRow",
    "ScanEngine.ANonRecursiveRescanKeepsASubdirectoryRow",
    "ScanEngine.ARescanWithoutHiddenKeepsAHiddenFilesRow",
]
test_kind = "witness"
status = "holds"
test_gap = "All three flags now have a test that indexes a file, rescans with a flag that would have excluded it from the walk, and asserts the row is still there with removed at 0. Two clauses of the rationale are still untested, both of them measured by running the binary rather than pinned. The converse: a row the walk never admitted is still deleted once its file is gone, because the candidate set is the prefix and not the walk. And the containment half: scanning a subdirectory reconciles that subtree and leaves every row above it alone."
