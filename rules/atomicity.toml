[[rule]]
id = "R28"
tier = "engine"
concern = "atomicity"
statement = "Every write transaction opens with BEGIN IMMEDIATE, so a transaction that reads and then writes cannot fail with SQLITE_BUSY_SNAPSHOT."
rationale = "SQLite in WAL mode pins a read snapshot at the first read of a deferred transaction; if another connection commits before this one writes, the upgrade fails with SQLITE_BUSY_SNAPSHOT, which the busy handler does not retry — so the 30-second busy_timeout does not help and the write simply fails. Taking the write lock at BEGIN turns that failure into a wait. Every read-then-write path in the engine has this shape: delete_paths_logged reads a row to snapshot it before deleting it, log_prune scans operations before deleting them, and init_schema reads the version before writing it."
enforced_at = [
    "core/database.cpp:begin_transaction",
    "core/database.cpp:delete_paths_logged",
    "core/database.cpp:log_prune",
    "core/database.cpp:insert_batch",
    "core/database.cpp:init_schema",
    "core/database.cpp:apply_migration_step",
]
binds = [
    "scan.walk", "scan.reconcile", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "relink.transfer", "relink.demote", "relink.demote_live_photo",
    "metadata.write", "faces.rebuild", "faces.identify",
]
protects = ["db-row", "user-metadata", "activity-log"]
tests = [
    "DatabaseConcurrency.BeginTransactionTakesWriteLockImmediately",
    "DatabaseConcurrency.DeferredBeginCanBusySnapshotOnReadThenWrite",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R29"
tier = "engine"
concern = "atomicity"
statement = "Each schema migration takes the write lock before it reads the version and re-reads the version inside that transaction, so a step another process already applied is skipped rather than re-run."
rationale = "The migrations are not idempotent — ALTER TABLE ADD COLUMN fails the second time — so two first runs starting together would otherwise both apply the same step and one would die. Re-reading inside the IMMEDIATE transaction means the loser sees the winner's version and moves on. The two schema-creation paths have the same shape for the same reason: each creates every table and sets the version in one transaction, so a crash partway cannot leave a versionless partial schema that the next run misreads as pre-migration."
enforced_at = ["core/database.cpp:init_schema", "core/database.cpp:apply_migration_step"]
binds = [
    "scan.walk", "scan.reconcile", "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "thumbs.rebuild", "thumbs.clean", "faces.rebuild", "faces.identify",
    "relink.transfer", "relink.demote", "relink.demote_live_photo", "metadata.write",
]
protects = ["db-row", "user-metadata", "activity-log"]
tests = [
    "DatabaseConcurrency.ConcurrentMigrationIsSafe",
    "DatabaseConcurrency.AMigrationStepAnotherThreadAppliedIsSkippedInsideTheTransaction",
    "SchemaUpgradeTest.APreMigrationRepairAnotherConnectionOvertookIsSkipped",
    "SchemaUpgradeTest.AFreshSchemaOvertakenByANewerBuildIsRefusedAndNotRestamped",
]
test_kind = "witness"
status = "holds"
test_gap = "ConcurrentMigrationIsSafe races two threads through init_schema on a rolled-back database and catches a regression only statistically: nothing forces the interleave, so a run where one thread finishes before the other starts has the second read the current version and do nothing, never entering the re-check inside the IMMEDIATE transaction, and passing identically. Measured with the re-check deleted from init_schema, it failed 0 of 20 runs. AMigrationStepAnotherThreadAppliedIsSkippedInsideTheTransaction forces what that one hopes for: a third connection holds the write lock while both threads read version 4 and then block on the first migration's BEGIN IMMEDIATE, so one applies every step and the other finds them applied from inside its own transaction. Each thread's init_schema is timed, because a thread that had read the current version would have returned without opening a transaction at all — that is the assertion which says the window was entered. With the same re-check deleted it failed 20 of 20. What is still uncovered is the two schema-creation paths' one-transaction shape, which neither test reaches. The pre-migration path re-reads the version inside its IMMEDIATE transaction too, and commits nothing when another connection has created or upgraded the schema since its first read; without that it would stamp a current schema v1 and fail its v2 step for good. APreMigrationRepairAnotherConnectionOvertookIsSkipped forces that interleave: a pre-migration database, a second connection holding the write lock until the first has written its pre-upgrade copy, then a current version committed in its place. With the re-read removed it failed 3 of 3, the database left at v1 and the open failing on the v2 step. The fresh-schema path re-reads as well. Its statements are CREATE ... IF NOT EXISTS or INSERT OR IGNORE, but set_schema_version is INSERT OR REPLACE, so without the re-read it would stamp a newer build's schema back down to this build's version. AFreshSchemaOvertakenByANewerBuildIsRefusedAndNotRestamped holds the write lock while the opening connection waits on that path's BEGIN IMMEDIATE, then commits a newer version in its place; with the fresh path's re-read disabled it fails, the open succeeding against the newer schema."

[[rule]]
id = "R30"
tier = "engine"
concern = "atomicity"
statement = "Reconcile's relink and demote passes commit one row at a time and its deletes commit as a single transaction, so an interruption between them leaves the copied fields on both rows — tags always, gallery when the target had none — the transferred faces on the target alone, and every stale row still present."
rationale = "The two halves have different failure costs. A transfer copies two of its three fields and moves the third: transfer_user_metadata unions tags onto the target and fills an empty gallery, leaving both in place on the source, while its faces clause is UPDATE faces SET image_id = ?, a move that strips the source row when it fires (R37). So a per-row commit that stops halfway leaves the copied fields duplicated and the faces on the target only, and neither state costs a label — the next scan re-derives the duplication and then deletes the stale row, and the moved faces already sit on the row that pass designated as the survivor. The deletes are the destructive half and go in one transaction, so a stopped run has dropped every stale row or none of them. The ordering between the passes is load-bearing and is pinned: relink runs before demote, so a shared target takes the moved row's gallery rather than the demoted JPEG's."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/relink.cpp:relink_moved_rows",
    "core/relink.cpp:demote_jpeg_rows",
    "core/relink.cpp:demote_live_photo_rows",
    "core/database.cpp:delete_paths_logged",
]
binds = ["scan.reconcile", "relink.transfer", "relink.demote", "relink.demote_live_photo"]
protects = ["user-metadata", "db-row"]
tests = [
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTarget",
    "ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTargetUnlogged",
    "ScanEngine.ReconcileInterruptedBeforeItsDeleteKeepsEveryTransferAndEveryStaleRow",
]
test_kind = "witness"
status = "holds"
test_gap = "Covered on reconcile's logged branch: a BEFORE DELETE trigger scoped to the second collected path catches the run with both transfers committed and neither row deleted, and the resumed run is compared against an uninterrupted control. The unlogged branch — relink and demote calls with op_id = 0, then delete_paths rather than delete_paths_logged — is not interrupted by any test, and neither is an interruption inside a transfer pass rather than between the passes and the delete."

[[rule]]
id = "R31"
tier = "engine"
concern = "atomicity"
statement = "log_begin_operation commits its operation row on its own before the first entry, so an interrupted run leaves an operation behind — marked interrupted by rm and by reconcile when the failure is an exception, and left in_progress when the process dies."
rationale = "Opening the operation outside the work's transaction is what makes the row survive a rollback: delete_paths_logged rolls back its own transaction on failure and the operation row stays, so the run is not invisible. The cost is that the terminal status is a second write. Only two of the three callers close the loop: cmd_rm and run_reconcile catch, mark the operation interrupted on a best-effort basis and rethrow, while OrganizeEngine::apply catches per file and writes interrupted when any file or attachment failed (R27). A process that dies instead — a signal, a crash, the machine going away — leaves in_progress under every caller; plan 020 recorded that when it wrote log_finish_operation, noting the state is harmless for its own slice and meaningful for the deferred viewer that still does not exist."
enforced_at = [
    "core/database.cpp:log_begin_operation",
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/remove_exec.cpp:cmd_rm",
    "core/organize_engine.cpp:OrganizeEngine::apply",
]
binds = [
    "scan.reconcile", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
]
protects = ["activity-log"]
tests = [
    "OrganizeEngineTest.CancellationPartwayMarksTheOperationInterrupted",
    "DatabaseTest.LogBeginOperationCommitsItsRowBeforeAnyEntry",
    "ScanEngine.ReconcileMarksItsOperationInterruptedWhenTheDeleteThrows",
    "RemoveExecTest.RmMarksItsOperationInterruptedWhenTheDeleteThrows",
]
test_kind = "witness"
status = "holds"
test_gap = "A killed process is not covered and cannot be: no test stops one. What stands in for it is the committed-and-unfinished row a second connection can already read, which is the state a kill leaves; nothing pins that a signal specifically produces it. OrganizeEngine::apply's clause is pinned by R27's tests, not here."

[[rule]]
id = "R32"
tier = "engine"
concern = "atomicity"
statement = "OrganizeEngine::apply moves or copies one media file, then commits that file's path update and log entry in a single transaction and compensates if it fails, before starting the next — so a run that stops partway leaves every media file before the stop point moved and recorded and every one after it untouched."
rationale = "A rename cannot go inside a SQL transaction, so the disk action happens first and outside: move_file runs, then begin_transaction covers only update_path_in_txn and log_add_entry. What makes the pair behave as a unit is compensation rather than a shared transaction — a database failure moves the file back, and a failed move-back is thrown with both paths named rather than swallowed, because the file then sits somewhere no row names. The unit is the media file alone: carry_sidecars runs after execute_organize_action has returned and its transaction has committed, so an attachment moved for that file is outside this boundary and is R33's window, not this rule's."
enforced_at = [
    "core/organize_engine.cpp:OrganizeEngine::apply",
    "core/organize_exec.cpp:execute_organize_action",
]
binds = ["organize.copy", "organize.move"]
protects = ["original-file", "db-row", "activity-log"]
tests = [
    "OrganizeEngineTest.CancellationPartwayMarksTheOperationInterrupted",
    "OrganizeExecTest.MoveRestoresPriorFileOnDbFailureWhenOverwriteAllowed",
    "OrganizeExecTest.CopyRestoresPriorFileOnDbFailureOverwrite",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R33"
tier = "engine"
concern = "atomicity"
statement = "A change that touches only the disk — trashing a file, hard-deleting it, carrying a sidecar or an attached JPEG — is written to disk first and logged afterwards in its own autocommit, so an interruption between the two leaves the change done and unrecorded."
rationale = "A rename and a SQLite commit cannot be one transaction, so one of them goes first, and these paths put the disk action first. Nothing compensates for the gap: execute_organize_action moves a file back when its database write fails, and execute_trash_action and carry_sidecars have no equivalent — if log_add_entry throws, the file stays where it was put and the log does not mention it. carry_sidecars catches that failure per attachment, counts the file in carried and also lists it in failures, so the caller learns of the missing log entry through attachment_errors. For trash that means a file sitting in the trash directory under a random-hex name with nothing recording where it came from, which is the one case where the name alone does not say."
enforced_at = [
    "core/remove_exec.cpp:execute_trash_action",
    "core/remove_exec.cpp:execute_hard_delete_action",
    "core/organize_exec.cpp:carry_sidecars",
]
binds = ["remove.trash", "remove.hard", "organize.copy", "organize.move"]
protects = ["attachment", "original-file", "activity-log"]
tests = [
    "RemoveExecTest.TrashMovesFileAndLogs",
    "RemoveExecTest.HardDeleteRemovesAndLogs",
    "OrganizeExecTest.CarryLogsSidecarEntryWithParentId",
    "RemoveExecTest.TrashLeavesTheFileMovedAndUnloggedWhenTheLogWriteFails",
    "RemoveExecTest.HardDeleteLeavesTheFileGoneAndUnloggedWhenTheLogWriteFails",
    "OrganizeExecTest.CarryLeavesTheSidecarMovedAndUnloggedWhenTheLogWriteFails",
]
test_kind = "witness"
status = "holds"
test_gap = "The window and the absent compensation are covered at all three anchors: PRAGMA query_only fails the log write with the disk change already made, and each test asserts the file stayed where it was put and no entry names it. What the three do not cover is the carry of a Live Photo's video, which is the same code path further down carry_sidecars and logs the same way."

[[rule]]
id = "R34"
tier = "engine"
concern = "atomicity"
statement = "A committed transaction survives a process crash but not necessarily an operating-system crash or a power loss: the connection runs WAL with synchronous=NORMAL, which does not fsync the write-ahead log at every commit."
rationale = "This is the durability the pragma buys and the cost it accepts, and no plan states either. The consequence is bounded rather than arbitrary: move_file and atomic_copy_file fsync the file and its parent directory before the rename, so the bytes are on disk even when the row naming them is not, and the state a power loss can leave — the file at the destination, the row still naming the source — is the one execute_organize_action's compensation already handles and a rescan reconciles. Recorded because a reader who sees BEGIN IMMEDIATE everywhere will otherwise assume commits are durable against everything."
enforced_at = ["core/database.cpp:Database::Database"]
binds = [
    "scan.walk", "scan.reconcile", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "relink.transfer", "relink.demote", "relink.demote_live_photo",
    "metadata.write", "faces.rebuild", "faces.identify",
]
protects = ["db-row", "user-metadata", "activity-log"]
tests = []
test_kind = "subprocess"
status = "unenforced"
test_gap = "Nothing tests durability across a power loss, and an ordinary test process cannot: it would need the machine to stop between the commit and the checkpoint. The statement is read from the pragma and SQLite's documented WAL behaviour, not from a measurement."

[[rule]]
id = "R48"
tier = "engine"
concern = "atomicity"
statement = "A copy or move counts each selected item once: an item is reported as applied or as failed, never as both."
rationale = "An item counts once, in applied or in errors, by its photo's outcome: apply increments applied and files_written when execute_organize_action returns, and a carry that fails afterwards cannot move the item into errors. carry_sidecars reports each attachment it could not carry in CarryResult::failures rather than throwing, and apply counts those in attachment_errors, so the caller is told which half of a half-done item is missing and applied + errors still never exceeds the actionable count the progress ticks are denominated against. The progress message names the parent and each attachment. R41 is what makes a carry refuse rather than destroy, and R33 records that a carried file is logged outside the parent's transaction. A run with any attachment_errors is not completed (R27)."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::apply"]
binds = ["organize.copy", "organize.move"]
protects = ["attachment", "activity-log"]
tests = [
    "OrganizeEngineTest.AnAttachmentNotCarriedCountsItsItemOnceAndInterruptsTheRun",
    "OrganizeCarryNoClobber.OneRefusedAttachmentDoesNotStopTheOthers",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R72"
tier = "engine"
concern = "atomicity"
statement = "A run that will detect faces establishes that it can detect before it writes anything: the OpenCV it was built against must be able to run the detection model, and both model files must be present."
rationale = "Both engines build every FaceDetector up front — ScanEngine::run_workers before the first file, FacesEngine::run after selection and before the first worker — so a constructor that throws costs the run and nothing else. Deferring either check to the first detection would not: the workers are already committing batches by then, and parallel_for_each stops every worker on the first exception, so the failure would arrive on top of a partly written scan. The OpenCV half is the one that was missing. YuNet 2023mar's ONNX graph imports on older OpenCV and cannot run: FaceDetectorYN::create succeeds and the first detect() throws '(-204:Requested object was not found) Layer with requested id=-1 not found in function getLayerData'. Measured against the model file phig downloads — 4.6.0 and 4.7.0 both throw, 4.8.0 and 4.10.0 both run it clean, and FaceRecognizerSF::create works on all four, so the detector alone sets the 4.8.0 floor. Ubuntu 24.04 ships 4.6.0, which is why the guard exists rather than being a theoretical case. The check is compile-time because the linked OpenCV is fixed when phig is built, and it runs ahead of the models check because below the floor the models are beside the point: telling that user to download them would send them the wrong way."
enforced_at = ["core/faces.cpp:FaceDetector::Impl"]
binds = ["scan.walk", "faces.rebuild"]
protects = ["db-row"]
tests = [
    "ScanEngine.FacesModeFailsClearlyBelowTheOpenCVFloor",
    "ScanEngine.FacesModeFailsClearlyWhenModelsAreMissing",
    "FacesEngineRun.RefusesTheRunWhenNoDetectorCanBeBuiltAndWritesNothing",
    "FacesEngineRun.CliFaceNameRefusesWhenNoDetectorCanBeBuilt",
    "FacesEngineRun.CliSearchByFaceRefusesWhenNoDetectorCanBeBuilt",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The other three entry points are covered now: FacesEngine::run over a non-empty selection, and `phig face name` and `search --face` as subprocess cases. None of them skips. They create the missing-models condition instead of waiting for a machine that has it — the in-process one points models_dir() at an empty directory through set_models_dir, the two subprocess ones inherit an empty XDG_CACHE_HOME — and each asserts the reason that applies on the leg it runs on, the models below the OpenCV floor and the version below it. Each also asserts nothing was written: the rebuild's existing face row is still there, `face name` created no person, and the search listed no image. Measured with both checks in FaceDetector::Impl short-circuited: all three fail, and what arrives instead is OpenCV's own 'Can't read ONNX file', which is the opaque failure the guard exists to replace. The two scan-path witnesses still skip in the models-present run that check 2 reads, so a failure in either surfaces as a red step rather than as this rule's name. The 4.8.0 floor itself is pinned by no test at all — it came from running the shipped model against four OpenCV builds by hand, and a future model swap would not re-derive it."

[[rule]]
id = "R80"
tier = "engine"
concern = "atomicity"
statement = "A scan whose indexing phase failed does not run its reconcile phase, so nothing is deleted on the strength of a walk that did not finish."
rationale = "Reconcile deletes rows whose files it could not find, so running it after a walk that aborted partway would delete rows for files that were simply never reached. --on-error fail is the flag that makes that reachable: an unreadable file makes run_workers flush what completed and rethrow, and cmd_scan catches the exception, prints it and returns 1 at cli/main.cpp:324-334, above the run_reconcile call at :340. ScanEngine::run composes the two the same way, run_workers then run_reconcile with a throw from the first propagating past the second (core/scan_engine.cpp:110-114), but it has no production caller — cli/ and libphig/ both call the split phases — so the sequencing has to be re-stated by every caller, and that is why this is recorded as violated rather than as a property of the engine. Cancellation is the other side of the same decision and goes the other way deliberately: an interrupted walk returns completed = false rather than throwing, and cmd_scan reconciles anyway, which is safe for the same reason the statement is needed — a file the walk never reached is still on disk, so it is not a deletion candidate (R75) — and R56 records that reconcile polls no token once it starts."
enforced_at = [
    "cli/main.cpp:cmd_scan",
    "core/scan_engine.cpp:ScanEngine::run",
]
binds = ["scan.walk", "scan.reconcile"]
protects = ["db-row", "user-metadata"]
tests = ["ScanEngine.FailOnErrorThrowsAndCommitsWhatCompleted"]
test_kind = "witness"
status = "violated"
test_gap = "The listed test drives ScanEngine::run with fail_on_error and an undecodable file and checks that what completed before the throw was flushed. It asserts nothing about reconcile: it neither indexes a file, deletes it from disk and checks the row survives the failed rescan, nor covers cmd_scan, which is the sequencing the CLI actually runs and which no fixture calls. The engine and the CLI stating the same order twice is the defect, and no test compares them."

[[rule]]
id = "R88"
tier = "engine"
concern = "atomicity"
statement = "A schema migration step fails only on foreign key violations it creates, and no step runs until a backup of the database has been written."
rationale = "Steps run with foreign keys off (R84), so apply_migration_step reads PRAGMA foreign_key_check inside the step's transaction before and after the step, and rolls back only if the after set holds a violation the before set does not. A violation is identified by child table, child rowid and parent table, not by the foreign key's index, which a table rebuild can renumber. Because the identity is the rowid, a future step that rebuilds a table without an INTEGER PRIMARY KEY, such as image_tags, renumbers its rows and makes every orphan in it read as new, so the step would fail; such a step must carry the rowids across (INSERT ... SELECT rowid, ...). Checking the whole database instead failed every step on rows no step had made: a catalog carrying faces rows whose images row was deleted before foreign keys were enforced could not reach any later version, and since reads refuse an outdated catalog (R70) and every write opens through an upgrade, no version of phig could open it for writing. Existing orphans are carried through unchanged; deleting them would make an upgrade destroy rows, labels among them, on its own authority, and whether to repair them is a separate destructive decision this rule does not make. Upgrades are automatic and forward-only and a catalog newer than the build is refused, so an upgrade cannot be undone by running the older phig. write_upgrade_backup therefore writes VACUUM INTO a new file beside the database, named for the version read and the UTC second (phig.db.v7-backup-20261113T201500Z), and flushes the file to disk, and its directory on a best-effort basis, before the first step's transaction — VACUUM INTO cannot run inside one — and before the pre-migration path's schema repair. The name is claimed with an exclusive create, so an existing file is never overwritten; a name already taken, as by a second process upgrading in the same second, gets a numeric suffix. If the copy cannot be written or the file cannot be flushed, init_schema throws before any step and the database is unchanged. settle_upgrade_backup keeps the copy, reports it through upgrade_backup_path and logs it at warning level only when this connection committed a step. When it committed none — the upgrade failed before its first commit, or another process applied every step first — the database is not what the copy guards against losing, so the copy is removed; otherwise every retried open of a catalog that cannot upgrade would leave another one. A process that loses a concurrent upgrade partway keeps its copy, which may hold a later version than its name says, but no process runs a step before its own copy is on disk. phig never deletes a copy that a committed step depends on. Measured on a synthetic catalog of 30,000 images with one face and embedding each: the copy took about 50 ms on tmpfs and 70-76 ms on ext4/NVMe within a 340-424 ms upgrade from v7."
enforced_at = [
    "core/database.cpp:init_schema",
    "core/database.cpp:write_upgrade_backup",
    "core/database.cpp:settle_upgrade_backup",
    "core/database.cpp:apply_migration_step",
    "core/database.cpp:foreign_key_violations",
]
binds = [
    "scan.walk", "scan.reconcile", "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "thumbs.rebuild", "thumbs.clean", "faces.rebuild", "faces.identify",
    "relink.transfer", "relink.demote", "relink.demote_live_photo", "metadata.write",
]
protects = ["db-row"]
tests = [
    "SchemaUpgradeTest.AV7CatalogWithOrphanRowsUpgradesAndKeepsEveryRow",
    "SchemaUpgradeTest.AStepThatAddsAViolationFailsAndRollsBackBesideExistingOrphans",
    "SchemaUpgradeTest.TheBackupIsWrittenBeforeTheFirstStepAndHoldsTheOldDatabase",
    "SchemaUpgradeTest.NoBackupIsWrittenWhenNoStepIsPending",
    "SchemaUpgradeTest.AnExistingFileAtTheBackupsNameIsLeftAlone",
    "SchemaUpgradeTest.WhenTheBackupCannotBeWrittenNoStepRuns",
    "SchemaUpgradeTest.AnUpgradeThatFailsBeforeAnyStepCommitsRemovesItsBackup",
    "SchemaUpgradeTest.AnUpgradeThatFailsAfterAStepCommittedKeepsItsBackup",
    "SchemaUpgradeTest.AConnectionWhoseStepsAnotherAppliedKeepsNoBackup",
    "SchemaUpgradeTest.APreMetaDatabaseIsBackedUpAsV0",
    "SchemaUpgradeCliTest.ScanUpgradesAV7CatalogWithOrphansAndNamesTheBackup",
]
test_kind = "witness"
status = "holds"
test_gap = "The step that adds a violation is a test's own step run through apply_migration_step, not a shipped migration, since none strands a row. The cannot-write case is reached through a read-only catalog directory while another connection keeps the WAL files open, so a disk-full failure partway through VACUUM INTO, a failed flush, and the removal of the partial file are not exercised, and nothing observes that the flush happened. The pre-migration path's copy is pinned, but not its behaviour when the copy cannot be written. The suffixed name for two copies in the same second is reached by DatabaseConcurrency's migration tests and asserted by none."
