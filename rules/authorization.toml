[[rule]]
id = "R20"
tier = "engine"
concern = "authorization"
statement = "A dry-run removal takes no disk action, deletes no row, opens no logged operation, and opens the catalog read-only, so it neither creates the database nor migrates its schema."
rationale = "The preview returns before the confirmation guard and before log_begin_operation, so nothing on disk moves and nothing about the selection is recorded. cmd_rm opens the catalog with CatalogAccess::Read when dry_run is set, so the preview cannot create a missing database or migrate an older one; it fails with a CatalogError instead (R70)."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row", "activity-log"]
tests = [
    "RemoveExecTest.RmDryRunTouchesNothing",
    "RemoveExecTest.RmDryRunOnAMissingCatalogCreatesNothing",
    "CatalogCliTest.ReadsRefuseAnOutdatedCatalogAndLeaveItsVersion",
]
test_kind = "witness"
status = "holds"
test_gap = "The migration half is pinned through the binary against a catalog stamped one version back, not against a database built at an older schema; the suite cannot build one."

[[rule]]
id = "R21"
tier = "engine"
concern = "authorization"
statement = "The copy and move preview is OrganizeEngine::plan, which writes nothing to disk or to the database, and the command that calls it opens the catalog read-only, so the preview neither creates nor migrates it."
rationale = "Keeping the preview in core/ rather than in a CLI branch is what lets every surface offer it: organize.plan is an operation with an ABI entry point, so a GUI showing a user what a move would do runs the same code the CLI's dry run runs. The CLI opens the catalog with CatalogAccess::Read for a dry run, so the preview is side-effect-free end to end (R70)."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::plan"]
binds = ["organize.plan"]
protects = ["original-file", "db-row", "activity-log"]
tests = [
    "OrganizeEngineTest.PlanWritesNothingToDiskOrDatabase",
    "OrganizeEngineTest.CliDryRunOverAMissingCatalogRefusesAndCreatesNothing",
    "OrganizeEngineTest.CliDryRunPreviewsEveryCopyAndWritesNothingElse",
    "CatalogCliTest.ReadsRefuseAnOutdatedCatalogAndLeaveItsVersion",
]
test_kind = "subprocess"
status = "holds"
test_gap = "Both clauses are driven through the binary. The migration clause uses a catalog stamped one version back, not one built at an older schema."

[[rule]]
id = "R22"
tier = "engine"
concern = "authorization"
statement = "A hard delete, and any removal that takes at least half the collection and touches twenty rows or more, proceeds only on an explicit yes: assume_yes, or a confirmer that returns true, with a missing confirmer counted as a refusal."
rationale = "Hard delete is the one removal mode with no trash behind it, so there is nothing to recover from afterwards and the authorization has to happen first. Counting a null confirmer as a refusal is the part that matters for a non-CLI caller: a client that never wired up a prompt gets a refusal rather than a silent deletion. How the yes is obtained — whether stdin is a terminal, what the prompt reads — is the surface's business and stays in cli/."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.hard", "remove.trash", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row"]
tests = [
    "RemoveExecTest.ConfirmCallbackRefusalCancelsTheOperation",
    "RemoveExecTest.ConfirmCallbackNullRefusesWithoutAsking",
    "RemoveExecTest.ConfirmCallbackAcceptanceProceeds",
    "RemoveExecTest.ConfirmCallbackBroadRemovalWarningTextIsExact",
]
test_kind = "witness"
status = "holds"
test_gap = "Three of the four listed tests drive the --hard arm and the fourth drives the broad arm at 20 of 20 rows, so every one of them is a removal the guard is supposed to stop. Nothing pins the negative side of the threshold: every other cmd_rm test in the suite sets assume_yes, so no test shows a removal below either bound — under half the collection, or fewer than twenty rows — proceeding with no confirmer supplied at all. A threshold that had drifted to 'always broad' would pass all four."

[[rule]]
id = "R59"
tier = "engine"
concern = "authorization"
statement = "Whether a planned decision may be overridden is a property of the decision type: an organize conflict resolution may be changed by the caller before apply, and reconcile's deletions may not."
rationale = "OrganizePlan::set_resolution is the only editing point in the engine, and it refuses three things — an index out of range, an item that does not conflict, and an overwrite whose destination is another image's not-yet-moved source — so the editable surface is exactly which of skip/overwrite/rename applies to a genuine conflict. The plan is a caller-owned value, so the edit touches no engine memory, and apply reads act.overridden as the authority that lets it replace a file that exists on disk. Reconcile is the other half and is not implemented: run_reconcile decides and deletes in one pass with no plan for a caller to hold, let alone edit, so 'not overridable' is true today only because there is nothing to override. Plan 041 builds the reconcile plan and states that its decisions are not overridable, which is what makes the asymmetry deliberate rather than accidental."
enforced_at = [
    "core/organize_engine.cpp:OrganizePlan::set_resolution",
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
]
binds = ["organize.plan", "organize.copy", "organize.move", "scan.reconcile"]
protects = ["original-file", "db-row", "user-metadata"]
tests = [
    "OrganizeEngineTest.SetResolutionRejectsANonConflictingItem",
    "OrganizeEngineTest.SetResolutionRejectsAnIndexOutOfRange",
    "OrganizeEngineTest.SetResolutionRefusesToTargetABatchSource",
    "AbiOrganizeTest.SetResolutionRejectsANonConflictingItem",
]
test_kind = "conformance"
status = "partial"
test_gap = "Every listed test is about organize. Nothing pins the reconcile half, because there is no reconcile plan to test — the claim there is about an absence, and the only thing a test could assert today is that run_reconcile takes no plan argument."

[[rule]]
id = "R60"
tier = "engine"
concern = "authorization"
statement = "An operation that destroys user-authored metadata is authorized before it runs, by an explicit yes or by a plan the caller approves."
rationale = "rm asks (R22), organize publishes a plan the caller applies, and reconcile transfers metadata onto a surviving row before deleting (R38). A face rebuild does none of these, and is reachable from the ABI as phig_op_faces_start with no plan phase; operations.toml marks faces.rebuild destructive. FacesEngine::run replaces each selected image's face rows — boxes, embeddings, and the person_id that is a label someone typed. Inside the per-image transaction it reads the image's labelled faces first, matches them to the new detections through carry_labels, and writes the matched labels before auto_label_face names the rest. carry_labels matches by embedding when the recognition model is unchanged, by box overlap when the model changed and the face rows record a frame identical to the new decode, and otherwise drops the label and counts it (R86). A labelled face that is not matched loses its label without authorization: the loss is counted in FacesResult::labels_dropped, reported by face rebuild as a warning and by phig_faces_result, and not asked about first. That remainder is why the rule is partial."
enforced_at = [
    "core/faces_engine.cpp:FacesEngine::run",
    "core/faces.cpp:carry_labels",
    "core/database.cpp:get_labelled_faces_for_image",
    "core/database.cpp:delete_faces_for_image",
    "core/database.cpp:insert_face",
]
binds = ["faces.rebuild"]
protects = ["user-metadata"]
tests = [
    "FacesEngineRun.RebuildKeepsALabelOnTheFaceItNamed",
    "FacesEngineRun.RebuildCountsALabelItCouldNotCarry",
    "FacesEngineRun.CliRebuildWarnsWhenItDropsALabel",
    "AbiOperations.FacesResultReportsLabelsItCouldNotCarry",
    "CarryLabels.AnIdenticalBoxCarriesItsLabel",
    "CarryLabels.OneDetectedFaceTakesAtMostOneLabel",
    "FacesEngineRun.RebuildCarriesALabelWhenTheImageIsReplacedByARescaledCopy",
    "CarryLabels.ARowFromBeforeV10IsTakenAsTheSfaceModelWithAnUnknownFrame",
]
test_kind = "witness"
status = "partial"
test_gap = "The engine, CLI and ABI witnesses skip wherever the face path cannot run — models absent, or OpenCV below 4.8.0 (R72) — so ubuntu-26.04 is the only CI leg that runs them; the CarryLabels unit tests run everywhere. Nothing pins authorization before an unmatched label is dropped, because the code does not ask."

[[rule]]
id = "R61"
tier = "engine"
concern = "authorization"
statement = "A destructive operation's preview is a value the caller can inspect, not text the engine prints."
rationale = "OrganizeEngine::plan returns an OrganizePlan — one entry per file carrying source, intended destination, resolved destination, whether it conflicts, and whether phig tracks the occupant — which is why cp and mv have a dry run on every surface and libphig can expose phig_organize_plan_source_at and its siblings. Remove has the opposite shape: cmd_rm computes the same information and writes it to std::cout as prose, including the [DRY RUN] listing at remove_exec.cpp:129-130 and the skip counts above it, and returns an int. A caller that is not a terminal gets nothing — no list, no counts, no way to render 'these 412 files will be deleted' — so remove cannot take the plan/apply shape R66 requires until its preview becomes data. This is the load-bearing half of a wider drift from core/CLAUDE.md, which says an engine carries no user-facing prose and that wording is the caller's job: 23 lines across seven core/ files write to std::cout, std::cerr or stderr — remove_exec.cpp (10), models.cpp (8), config.cpp:138, hasher.cpp:309, lockfile.cpp:59, log.cpp:97 and organize_exec.cpp:134. The other thirteen are diagnostics and progress cosmetics; these ten are an operation's result. log.cpp:97 is counted although it is the logger's own open failure rather than an operation's output: it is the one write with no alternative, since the mechanism that would otherwise carry the message is the thing that failed."
enforced_at = ["core/remove_exec.cpp:cmd_rm", "core/organize_engine.cpp:OrganizeEngine::plan"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "organize.plan"]
protects = ["original-file", "db-row", "user-metadata"]
tests = [
    "OrganizeEngineTest.PlanProducesOneActionPerSelectedImage",
    "RemoveExecTest.RmDryRunTouchesNothing",
]
test_kind = "witness"
status = "violated"
test_gap = "The organize half is covered. Nothing asserts what a dry-run rm returns, because it returns nothing to assert: RemoveExecTest.RmDryRunTouchesNothing checks that the file and the row survive and cannot check the preview, which exists only on stdout."

[[rule]]
id = "R68"
tier = "engine"
concern = "authorization"
statement = "Trash empty destroys its contents permanently and only after authorization: an empty trash returns without asking, --yes skips the prompt, and otherwise it refuses outright unless run at an interactive terminal where the operator types the literal string 'yes' in response to a prompt naming the item count and the trash directory."
rationale = "Trash is what makes rm's default mode recoverable (R23): the row goes, the bytes stay in <catalog>/trash. cmd_trash_empty in cli/main.cpp is where that recoverability ends — it is the one command with no restore snapshot and no activity-log entry behind it, so whatever it deletes is gone. The guard guarding that step is real, and it is the same shape as R22's hard-delete guard: it short-circuits on an empty trash before asking anything, otherwise prints the count and directory, refuses non-interactively so a piped 'yes' cannot bypass it, and only proceeds once the operator types 'yes' at a TTY; --yes exists for a caller that has already decided. What it deletes is every entry in <catalog>/trash, and a catalog can be any directory the user names, so `phig --catalog ~/Pictures scan ...` makes ~/Pictures/trash phig's trash, including a trash/ that was there before; nothing checks that phig put an entry there before removing it, and plan 064 owns that check. But the guard is cli/main.cpp code with no core/ counterpart: operations.toml's own trash.empty entry names cli/main.cpp:cmd_trash_empty as its core_entry, remarking that no core/ primitive exists for it. So libphig has nothing to call, a future phigd has nothing to call, and the GTK client has nothing to call — each would have to reimplement the confirmation rather than inherit it, which is exactly the failure mode root CLAUDE.md's 'enforcement belongs in core/ or libphig/, never cli/' rule exists to name. libphig/CLAUDE.md already lists 'Remove — rm's modes, trash empty' as missing ABI coverage under 053, and libphig links phig-core rather than cli/, so 053 cannot expose trash.empty without moving this guard into core/ first. Anchored at cli/main.cpp deliberately: the location is the defect, and status is violated for exactly that reason rather than because the guard is wrong."
enforced_at = ["cli/main.cpp:cmd_trash_empty"]
binds = ["trash.empty"]
protects = ["original-file", "attachment"]
tests = ["CatalogCliTest.TrashEmptyLeavesAnotherCatalogsTrash"]
test_kind = "subprocess"
status = "violated"
test_gap = "CatalogCliTest.TrashEmptyLeavesAnotherCatalogsTrash runs `trash empty --yes`, so the --yes bypass is exercised, but it asserts which catalog's trash is emptied. Still unpinned: the empty-trash short-circuit, the non-interactive refusal and the typed-confirmation path. cmd_trash_empty reads stdin and calls isatty directly, so the only test that could reach them is a subprocess driving the built phig binary, on the model of RemoveExecTest.CliRefusesNonInteractiveConfirmationEvenWithPipedYes, which pins the equivalent guard on cmd_rm."

[[rule]]
id = "R74"
tier = "engine"
concern = "authorization"
statement = "An operation acts on every tracked path that no --exclude matches and, when any --match was given, that at least one --match matches; with no --match at all it acts on everything."
rationale = "One function decides this for every command: passes_selection checks the excludes first and returns false on the first hit, so exclude wins wherever the two overlap and an excluded path cannot be moved, deleted, re-detected or relabelled by the run that excluded it. The second half is the one that surprises. With an empty match list the function returns true for every path, so `phig rm --exclude '*.png'` selects the whole collection minus the PNGs rather than nothing, and `phig face rebuild` with no flags selects every image. Both are deliberate and both have a guard elsewhere rather than here: rm's broad-selection confirmation covers the first (R22), and tag, gallery and fav refuse an unnamed selection outright (R78). The comparison is against the whole path, not the basename — callers pass img.path — so an exclude may name a directory. Seven call sites in all: five in core/ (faces_engine.cpp:81, organize_engine.cpp:76, remove_exec.cpp:82, thumbs_engine.cpp:28, search_engine.cpp:100) and two in cli/ (main.cpp:489 and :1538, the second being select_paths, which is how tag, gallery and fav reach it)."
enforced_at = ["core/selection.cpp:passes_selection"]
binds = [
    "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "thumbs.rebuild", "faces.rebuild", "metadata.write",
]
# All three collection assets, because the selection decides which files an
# operation writes over or deletes, which rows it drops, and which rows lose
# their tags, gallery or face labels. thumb-cache is left off: thumbs.rebuild
# only adds to it, and the deletions are thumbs clean's, which takes no globs.
protects = ["original-file", "db-row", "user-metadata"]
tests = [
    "FilterTest.NoFiltersPassesAll",
    "FilterTest.FilterWinsOverMatch",
    "FilterTest.MatchAndFilterTogether",
    "FilterTest.MatchesAgainstFullPath",
    "FilterTest.MultipleFilters",
    "RemoveExecTest.HardRemovalLeavesAnExcludedFileAndItsRowAlone",
    "OrganizeEngineTest.ApplyLeavesAnExcludedFileAndItsRowAlone",
    "ThumbsEngineRun.AnExcludedRowGetsNoThumbnail",
    "FacesEngineRun.AnExcludedImagesFacesAreLeftAlone",
    "DatabaseTest.CliTagAddSkipsAnExcludedPath",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The five FilterTest cases pin the predicate. The five below them run a mutating operation with an --exclude and assert the excluded file, its row and its metadata survived: a --hard rm, an OrganizeEngine::apply move, a thumbs run whose excluded sha gets no cache entry, a faces rebuild that leaves a named face where a re-detection would have deleted it, and `phig tag add` through cli/main.cpp:select_paths, the route tag, gallery and fav take and the only one that selects outside core/. Measured with the exclude loop in passes_selection short-circuited: all five fail, each on the file or row it was meant to spare. Two narrower things stay unpinned. The operation tests drive one member of each family — hard of remove's four modes, move of organize's two — which is the shared call site in each executor rather than the whole family, and organize.plan is covered by PlanHonorsMatchAndExclude instead. And FacesEngineRun.AnExcludedImagesFacesAreLeftAlone needs a detector, so it skips below the OpenCV floor and where the models are absent, which is the ubuntu-24.04 leg."

[[rule]]
id = "R77"
tier = "engine"
concern = "authorization"
statement = "Cleaning the thumbnail cache removes only files whose names match phig's thumbnail contract and whose hash no row claims, and a dry run removes nothing at all."
rationale = "The cache directory is not phig's private space: thumbnails live in <catalog>/thumbs, resolved by current_catalog(), and a catalog can be any directory, so a recursive delete over it could take files phig never wrote. It cleans only its own catalog's thumbs/: another catalog's cache, even one holding the same orphaned name, is never visited. Every regular file under it is tested with is_thumbnail_filename — a 64-hex stem and a .jpg suffix — and anything else is counted as foreign and left, then a thumbnail whose stem is in db.get_all_sha256s() is kept and the rest are removed. --dry-run prints the same list and removes nothing, including the sweep of emptied subdirectories, which is skipped as a whole rather than per entry. Measured with the built binary against a scratch thumbnail directory holding one orphaned thumbnail and one notes.txt: `thumbs clean --dry-run` printed 'Would remove 1 orphaned thumbnails' and 'Left untouched 1 non-thumbnail files in the cache directory' and left both files where they were; the same command without the flag removed the thumbnail and left notes.txt with its bytes intact. Recorded as violated for where the guard lives, not for what it does. is_thumbnail_filename is a core/ predicate, but the loop that consults it, the dry-run branch and the directory sweep are all in cli/main.cpp, and no core/ primitive cleans a thumbnail cache — libphig/CLAUDE.md lists `thumbs clean` among what the ABI cannot reach, noting that the loop itself is in cli/, and 053 owns closing that. A client that grew its own cache cleaning would inherit none of this."
enforced_at = ["cli/main.cpp:cmd_thumbs", "core/thumbs.cpp:is_thumbnail_filename"]
binds = ["thumbs.clean"]
# thumb-cache is what it is meant to delete from. original-file is what the
# foreign-file check protects: a file in that directory that phig did not write
# is somebody's, and nothing rebuilds it.
protects = ["thumb-cache", "original-file"]
tests = [
    "ThumbsTest.ThumbnailNameAcceptsValidSha256Jpg",
    "ThumbsTest.ThumbnailNameRejectsForeignFiles",
    "CatalogCliTest.ThumbsCleanLeavesAnotherCatalogsThumbnails",
]
test_kind = "witness"
status = "violated"
test_gap = "The first two call is_thumbnail_filename directly; tests/test_thumbs.cpp:117 says so in a comment, that the predicate 'gates thumbs clean deletion'. CatalogCliTest.ThumbsCleanLeavesAnotherCatalogsThumbnails drives the built binary and pins which catalog's cache is cleaned: an orphan in catalog A is removed and the same name in catalog B is left. It holds no foreign file and runs no dry run, so the loop's foreign-file skip, the --dry-run branch and the empty-directory sweep are still unpinned and were measured by running the binary."

[[rule]]
id = "R78"
tier = "engine"
concern = "authorization"
statement = "A metadata write refuses to run unless the caller named which images it applies to."
rationale = "tag add, tag remove, gallery set, gallery clear, fav add and fav remove each require at least one --match or a --path and exit 1 otherwise. Without that check the selection resolves to every row in the collection, since an empty filter matches everything (R74): `phig tag remove holiday` would strip that tag collection-wide and `phig gallery clear` would empty every gallery, both silently, both destroying user-authored metadata nothing can rebuild, and neither leaving a trace — metadata.write opens no logged operation, so there is no restore snapshot and no activity-log entry to read afterwards. The refusal is resolve_named_selection in core/selection.cpp, which returns nullopt when the caller named nothing at all; naming a selection that happens to match nothing is a different thing and returns an empty list, because the caller said what it wanted and nothing qualified. It sits on the resolve step rather than on the write because the write cannot see the hazard: set_tag_by_ids and set_gallery_by_ids receive an id list and cannot tell a caller that asked for the whole collection from one that forgot to filter. Resolution is where the omission is still visible, and putting it there is what makes it inheritable — a future phigd accepting a glob over HTTP calls the same function and gets the same refusal rather than reimplementing the check, which a cli/-only guard could not offer. The ABI needs none of it: phig_tag_add and its five neighbours take an explicit array of ids, so a client cannot ask for everything by omission. Plan 053 step 5 moved the guard here from three copies in cli/main.cpp, which is why this was recorded violated for its location; cli/ now renders the nullopt as its error and supplies only the wording."
enforced_at = ["core/selection.cpp:resolve_named_selection"]
binds = ["metadata.write"]
protects = ["user-metadata"]
tests = [
    "DatabaseTest.ResolveNamedSelectionRefusesAnUnnamedSubject",
    "DatabaseTest.ResolveNamedSelectionMayLegitimatelyMatchNothing",
    "DatabaseTest.CliMetadataWritesRefuseAnUnnamedSubject",
]
test_kind = "subprocess"
status = "holds"

[[rule]]
id = "R87"
tier = "engine"
concern = "authorization"
statement = "Every destination organize plans lies inside the destination directory the caller named; nothing a file carries and nothing in the format can place a file outside it."
rationale = "A format's tokens are substituted into a path joined onto the destination, and %camera, %make and %gallery come from the file's EXIF Model and Make and its gallery name, which a camera writes and anyone can edit. Substituted verbatim, a '/' adds directories, a '..' climbs out and an absolute value replaces the destination; measured with the built binary, a JPEG whose Model was '../../escaped' was copied two directories above the destination, and one whose Make was '/tmp/abs' was planned into /tmp/abs. The caller authorized a move into one directory, not wherever the file says, so three guards hold the line. apply_format expands each of those tokens to a single path component: '/' and '\\' become '_', control characters are dropped, and a value left empty, '.' or '..' takes its placeholder. validate(const OrganizeOptions&) refuses, before planning, a format that is an absolute path, has a '..' component, or uses an unknown token, which also catches a typo such as %y that would otherwise name a folder. OrganizeEngine::plan then checks each built destination lexically lies under the destination and throws if one does not; after the other two that cannot happen, so reaching it is a bug and no plan is produced. The R01 and R02 conflict guards are separate: they stop an overwrite at a path, these stop the path being outside the tree."
enforced_at = [
    "core/organize_plan.cpp:apply_format",
    "core/organize_plan.cpp:component",
    "core/organize_engine.cpp:validate",
    "core/organize_engine.cpp:OrganizeEngine::plan",
]
binds = ["organize.plan", "organize.copy", "organize.move"]
# original-file: the bytes are not destroyed, but a move puts the only copy
# outside the tree the user chose and named.
protects = ["original-file"]
tests = [
    "OrganizeEngineTest.AMakeOrModelThatClimbsOrIsAbsoluteStaysInsideTheDestination",
    "OrganizeEngineTest.AGalleryNameWithASlashPlansOneFolder",
    "OrganizeEngineTest.AValueThatCleansToNothingOrADotTakesItsPlaceholder",
    "OrganizeEngineTest.AFormatThatLeavesTheDestinationOrHasAnUnknownTokenIsRefused",
    "OrganizeEngineTest.CliCopyKeepsAFileWhoseModelClimbsInsideTheDestination",
    "AbiOrganizeTest.PlanRefusesAFormatThatLeavesTheDestination",
]
test_kind = "conformance"
status = "holds"
test_gap = "The containment check in plan() is unreachable once the other two guards hold, so no test reaches it; it is pinned only by reading. A symlinked directory inside the destination that points elsewhere passes, by design: the check is lexical, and following the user's own link is what they asked for."
