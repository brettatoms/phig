[[rule]]
id = "R20"
tier = "engine"
concern = "authorization"
statement = "A dry-run removal takes no disk action, deletes no row and opens no logged operation, but it still creates the database file and applies any pending schema migration."
rationale = "The preview returns before the confirmation guard and before log_begin_operation, so nothing on disk moves and nothing about the selection is recorded. What it does not skip is the connection: cmd_rm constructs a Database and calls init_schema before it reads dry_run, and both create-if-missing and the forward-only migration happen there. A preview that migrates a v7 database to v8 has changed the file it was asked not to touch, and no plan says so. This is the removal-shaped corner of the wider fact R70 records: every CLI command that opens a collection opens it read-write and migrates it, including the two operations.toml lists in read_only_cli. Database's read_only constructor flag exists and libphig uses it; cli/ never does."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row", "activity-log"]
tests = ["RemoveExecTest.RmDryRunTouchesNothing"]
test_kind = "witness"
status = "holds"
test_gap = "The test checks the file and the row survive; it does not check that no operation row was opened, and nothing pins the second clause at all. Both were measured by running the binary: a dry-run rm against a path with no database left a 120 KB v8 database there, and a dry-run rm against a populated one left the operations table exactly as it found it."

[[rule]]
id = "R21"
tier = "engine"
concern = "authorization"
statement = "The copy and move preview is OrganizeEngine::plan, which writes nothing to disk or to the database, but the command that calls it has already opened the database read-write and migrated it, so the preview is side-effect-free only below cli/."
rationale = "Keeping the preview in core/ rather than in a CLI branch is what lets every surface offer it: organize.plan is an operation with an ABI entry point, so a GUI showing a user what a move would do runs the same code the CLI's dry run runs. The alternative, a dry_run flag threaded into apply, would put the guard inside the function that writes, where every later edit has to remember it. The second clause is the same defect R20 records for rm, from the same shape of code: cli/main.cpp:609-610 calls init_schema before the dry_run check at :640, exactly as core/remove_exec.cpp:73-74 does before :128. It cannot be anchored here because the enforcement that would fix it is in cli/. Measured: a dry-run mv over three indexed files printed three destinations and left the operations table, the rows and the destination directory untouched, and a dry-run mv against a database pinned at schema_version 7 left it at 8."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::plan"]
binds = ["organize.plan"]
protects = ["original-file", "db-row", "activity-log"]
tests = ["OrganizeEngineTest.PlanWritesNothingToDiskOrDatabase"]
test_kind = "witness"
status = "holds"
test_gap = "The listed test pins the first clause, at the engine. Nothing pins the second: no test drives cmd_organize, and the migration it performs on a dry run was measured by running the binary."

[[rule]]
id = "R22"
tier = "engine"
concern = "authorization"
statement = "A hard delete, and any removal that takes at least half the collection and touches twenty rows or more, proceeds only on an explicit yes: assume_yes, or a confirmer that returns true, with a missing confirmer counted as a refusal."
rationale = "Hard delete is the one removal mode with no trash behind it, so there is nothing to recover from afterwards and the authorization has to happen first. Counting a null confirmer as a refusal is the part that matters for a non-CLI caller: a client that never wired up a prompt gets a refusal rather than a silent deletion. How the yes is obtained — whether stdin is a terminal, what the prompt reads — is the surface's business and stays in cli/."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.hard", "remove.trash", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row"]
tests = [
    "RemoveExecTest.ConfirmCallbackRefusalCancelsTheOperation",
    "RemoveExecTest.ConfirmCallbackNullRefusesWithoutAsking",
    "RemoveExecTest.ConfirmCallbackAcceptanceProceeds",
    "RemoveExecTest.ConfirmCallbackBroadRemovalWarningTextIsExact",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R59"
tier = "engine"
concern = "authorization"
statement = "Whether a planned decision may be overridden is a property of the decision type: an organize conflict resolution may be changed by the caller before apply, and reconcile's deletions may not."
rationale = "OrganizePlan::set_resolution is the only editing point in the engine, and it refuses three things — an index out of range, an item that does not conflict, and an overwrite whose destination is another image's not-yet-moved source — so the editable surface is exactly which of skip/overwrite/rename applies to a genuine conflict. The plan is a caller-owned value, so the edit touches no engine memory, and apply reads act.overridden as the authority that lets it replace a file that exists on disk. Reconcile is the other half and is not implemented: run_reconcile decides and deletes in one pass with no plan for a caller to hold, let alone edit, so 'not overridable' is true today only because there is nothing to override. Plan 041 builds the reconcile plan and states that its decisions are not overridable, which is what makes the asymmetry deliberate rather than accidental."
enforced_at = [
    "core/organize_engine.cpp:OrganizePlan::set_resolution",
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
]
binds = ["organize.plan", "organize.copy", "organize.move", "scan.reconcile"]
protects = ["original-file", "db-row", "user-metadata"]
tests = [
    "OrganizeEngineTest.SetResolutionRejectsANonConflictingItem",
    "OrganizeEngineTest.SetResolutionRejectsAnIndexOutOfRange",
    "OrganizeEngineTest.SetResolutionRefusesToTargetABatchSource",
    "AbiOrganizeTest.SetResolutionRejectsANonConflictingItem",
]
test_kind = "conformance"
status = "partial"
test_gap = "Every listed test is about organize. Nothing pins the reconcile half, because there is no reconcile plan to test — the claim there is about an absence, and the only thing a test could assert today is that run_reconcile takes no plan argument."

[[rule]]
id = "R60"
tier = "engine"
concern = "authorization"
statement = "An operation that destroys user-authored metadata is authorized before it runs, by an explicit yes or by a plan the caller approves."
rationale = "rm asks (R22), organize publishes a plan the caller applies, and reconcile transfers metadata onto a surviving row before deleting (R38). A face rebuild does none of these. FacesEngine::run deletes every selected image's face rows — boxes, embeddings, and the person_id that is a label someone typed — and re-derives labels only by auto_label_face matching each newly inserted face against faces still labelled at that moment, so a label survives only when a reference within threshold still exists. Nothing asks, and no plan documents the loss: 'grep -rln \"face rebuild\" plans/' returns seven plans plus the index — 022 (naming it as the way to force re-detection), 029 (which subcommands take the writer lock), 031 (an error count in its summary), 043 (CLI primitives), 045 (rowid reuse), 046 (the vec_faces delete failure) and 047 (a GUI menu item) — and none says a rebuild destroys labels; a proximity grep for label, name or person_id near rebuild adds nothing but 044, which says 'faces rebuild' and is about paging at scale. Measured with the built binary: a two-image collection with one face named Alice reported 'Alice (1 faces)'; 'phig face rebuild' then reported 'Done. 3 faces detected.' and 'phig face list' reported 'Alice (0 faces)'. The operation is reachable from the ABI as phig_op_faces_start with no plan phase, and operations.toml already marks faces.rebuild destructive. Plan 060 owns it: what authorizes a rebuild and whether a label can survive one are data-safety design questions, not ABI coverage, and 053's business is bringing face labelling to the ABI, not deciding what a rebuild is allowed to destroy."
enforced_at = [
    "core/faces_engine.cpp:FacesEngine::run",
    "core/database.cpp:auto_label_face",
    "core/database.cpp:delete_faces_for_image",
]
binds = ["faces.rebuild"]
protects = ["user-metadata"]
tests = []
test_kind = "subprocess"
status = "violated"
test_gap = "FacesEngineRun.RerunReplacesRatherThanAccumulatesFaceRows covers the delete-and-reinsert and asserts nothing about labels, and every FacesEngineRun case skips wherever the face models are absent, which includes CI — .github/workflows/ci.yml downloads none. The loss was measured by running the binary; no test asserts it either way."

[[rule]]
id = "R61"
tier = "engine"
concern = "authorization"
statement = "A destructive operation's preview is a value the caller can inspect, not text the engine prints."
rationale = "OrganizeEngine::plan returns an OrganizePlan — one entry per file carrying source, intended destination, resolved destination, whether it conflicts, and whether phig tracks the occupant — which is why cp and mv have a dry run on every surface and libphig can expose phig_organize_plan_source_at and its siblings. Remove has the opposite shape: cmd_rm computes the same information and writes it to std::cout as prose, including the [DRY RUN] listing at remove_exec.cpp:129-130 and the skip counts above it, and returns an int. A caller that is not a terminal gets nothing — no list, no counts, no way to render 'these 412 files will be deleted' — so remove cannot take the plan/apply shape R66 requires until its preview becomes data. This is the load-bearing half of a wider drift from core/CLAUDE.md, which says an engine carries no user-facing prose and that wording is the caller's job: 23 lines across seven core/ files write to std::cout, std::cerr or stderr — remove_exec.cpp (10), models.cpp (8), config.cpp:138, hasher.cpp:309, lockfile.cpp:59, log.cpp:97 and organize_exec.cpp:134. The other thirteen are diagnostics and progress cosmetics; these ten are an operation's result. log.cpp:97 is counted although it is the logger's own open failure rather than an operation's output: it is the one write with no alternative, since the mechanism that would otherwise carry the message is the thing that failed."
enforced_at = ["core/remove_exec.cpp:cmd_rm", "core/organize_engine.cpp:OrganizeEngine::plan"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "organize.plan"]
protects = ["original-file", "db-row", "user-metadata"]
tests = [
    "OrganizeEngineTest.PlanProducesOneActionPerSelectedImage",
    "RemoveExecTest.RmDryRunTouchesNothing",
]
test_kind = "witness"
status = "violated"
test_gap = "The organize half is covered. Nothing asserts what a dry-run rm returns, because it returns nothing to assert: RemoveExecTest.RmDryRunTouchesNothing checks that the file and the row survive and cannot check the preview, which exists only on stdout."

[[rule]]
id = "R68"
tier = "engine"
concern = "authorization"
statement = "Trash empty destroys its contents permanently and only after authorization: an empty trash returns without asking, --yes skips the prompt, and otherwise it refuses outright unless run at an interactive terminal where the operator types the literal string 'yes' in response to a prompt naming the item count and the trash directory."
rationale = "Trash is what makes rm's default mode recoverable (R23): the row goes, the bytes stay in <data_dir>/trash. cmd_trash_empty (cli/main.cpp:697-729) is where that recoverability ends — it is the one command with no restore snapshot and no activity-log entry behind it, so whatever it deletes is gone. The guard guarding that step is real, and it is the same shape as R22's hard-delete guard: it short-circuits on an empty trash before asking anything, otherwise prints the count and directory, refuses non-interactively so a piped 'yes' cannot bypass it, and only proceeds once the operator types 'yes' at a TTY; --yes exists for a caller that has already decided. But the guard is cli/main.cpp code with no core/ counterpart: operations.toml's own trash.empty entry names cli/main.cpp:cmd_trash_empty as its core_entry, remarking that no core/ primitive exists for it. So libphig has nothing to call, a future phigd has nothing to call, and the GTK client has nothing to call — each would have to reimplement the confirmation rather than inherit it, which is exactly the failure mode root CLAUDE.md's 'enforcement belongs in core/ or libphig/, never cli/' rule exists to name. libphig/CLAUDE.md:56 already lists 'Remove — rm's modes, trash empty' as missing ABI coverage under 053, and libphig links phig-core rather than cli/, so 053 cannot expose trash.empty without moving this guard into core/ first. Anchored at cli/main.cpp deliberately: the location is the defect, and status is violated for exactly that reason rather than because the guard is wrong."
enforced_at = ["cli/main.cpp:cmd_trash_empty"]
binds = ["trash.empty"]
protects = ["original-file", "attachment"]
tests = []
test_kind = "subprocess"
status = "violated"
test_gap = "No test calls cmd_trash_empty at all — not the empty-trash short-circuit, not the --yes bypass, not the non-interactive refusal, not the typed-confirmation path. It reads stdin and calls isatty directly, so the only test that could reach it is a subprocess driving the built phig binary, on the model of RemoveExecTest.CliRefusesNonInteractiveConfirmationEvenWithPipedYes, which pins the equivalent guard on cmd_rm."
