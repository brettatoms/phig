[[rule]]
id = "R07"
tier = "engine"
concern = "concurrency"
statement = "A read-then-write on a face row labels only the face it compared: an id whose face was deleted in the gap is out of circulation and matches nothing, and `person_id IS NULL` refuses a face another labeler named first."
rationale = "The face subcommands and libphig's faces operation both run lock-free, so a lock excludes only other lock-takers and identify's phase-2 write has to defend itself. The predicate is `UPDATE faces SET person_id = ? WHERE id = ? AND person_id IS NULL AND embedding = ?`, and `id = ?` is what carries the deletion case: schema v8 made faces.id AUTOINCREMENT (R51), so a candidate a concurrent rebuild deleted in the phase-1-to-phase-2 gap takes its id out of circulation, and the write matches no row rather than landing on whichever face replaced it. Reproduced against the system libsqlite3 3.51.0 phig links: three candidates read as ids 21, 22 and 23 were deleted, their replacements were issued 24, 25 and 26, and the three writes labeled zero rows — with the embedding clause and without it. `person_id IS NULL` is the clause still doing live work: it makes this a compare-and-set against another labeler, which matters because two lock-free paths can reach the same candidate, and deleting it is the one edit to this predicate that fails IdentifyTest.AnUnchangedFaceIsStillLabeled. `embedding = ?` is belt-and-braces against a state phig cannot reach — R71. A losing write updates zero rows rather than throwing, which is why `labeled` counts changed rows and not statements issued."
enforced_at = [
    "core/faces_engine.cpp:identify_person",
    "core/database.cpp:set_face_person_if_unchanged",
]
binds = ["faces.identify"]
protects = ["user-metadata"]
tests = [
    "IdentifyTest.ConcurrentRebuildNeverGetsAFaceLabeledItDidNotMatch",
    "IdentifyTest.AnUnchangedFaceIsStillLabeled",
    "IdentifyTest.TwoLabelersRacingForOneCandidateSetLabelEachFaceOnce",
]
test_kind = "witness"
status = "holds"
test_gap = "Each clause of the predicate is pinned by a different test and none of them pins all three. ConcurrentRebuildNeverGetsAFaceLabeledItDidNotMatch is the only test that opens the phase-1-to-phase-2 window against a deleter, and it passes on id retirement alone: measured in a scratch copy with `AND embedding = ?` deleted from set_face_person_if_unchanged, it stays green and the suite's only failure is AFaceWhoseEmbeddingChangedIsNotLabeled, so it does not discriminate between the clauses of the predicate it is cited for. TwoLabelersRacingForOneCandidateSetLabelEachFaceOnce now covers the case nothing reached before — two runs whose phase 1s both read the same ten candidates as unlabeled, forced by a third connection holding the write lock across both, so whichever phase 2 commits second finds four contested faces already named. Measured with `AND person_id IS NULL` deleted: the two runs' labeled counts sum to 14 instead of 10, on three runs of three. What is left unpinned is `embedding = ?`, deliberately: no concurrent path in phig produces the state it refuses, which is R71."

[[rule]]
id = "R49"
tier = "engine"
concern = "concurrency"
statement = "The advisory writer lock excludes only processes that construct one on the same file: no read takes it, and it never excludes a writer that takes none."
rationale = "WriterLock is an flock(2) on a sidecar file, held for the object's lifetime and released by the kernel on process death, so there are no stale locks to clear. Advisory is the whole shape of the guarantee — every promise it makes is a promise about lock-takers, which is why the face subcommands and libphig's operations can run beside it by design rather than by accident. core/ defines the class and constructs one nowhere; the ten call sites are branches of cli/main.cpp, and libphig constructs one only around its five metadata writes. Measured with the built binary while a separate process held the flock on the catalog's phig.db.lock: search --count, duplicates, face list and tag list all completed normally, and so did a mutating 'phig face rebuild', while thumbs rebuild, rm and tag add were refused under --no-wait with 'Another phig operation is running'."
enforced_at = ["core/lockfile.cpp:WriterLock"]
binds = [
    "scan.walk", "scan.reconcile", "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "trash.empty",
    "thumbs.rebuild", "metadata.write", "relink.transfer", "relink.demote",
    "relink.demote_live_photo",
]
protects = ["db-row", "original-file"]
tests = [
    "LockfileTest.AcquiresAndReleases",
    "LockfileTest.NoWaitThrowsWhenHeldByAnotherFd",
    "LockfileTest.WaitBlocksThenAcquiresAfterRelease",
    "LockfileTest.CliRefusesALockTakingWriteWhileAllowingReadsAndLocklessWrites",
]
test_kind = "subprocess"
status = "holds"
test_gap = "The first three drive WriterLock directly, with a raw flock on a second descriptor standing in for the other process, and pin the class rather than the rule. The fourth holds the lock the same way and drives the built binary against it: `tag add` is refused under --no-wait, `search --count` completes, and `face identify` — a command that mutates and takes no lock — labels its face while the lock is held. A control run after the release shows the refusal was the lock. The scratch catalog is the default catalog inside a redirected XDG_DATA_HOME, so the child's lock is the file the test holds; passing --catalog with another directory would put them on different files, which is R50. What is still unasserted is the ABI's side of the same two clauses — that a phig_query call on a context succeeds while a WriterLock is held, and that a Database::insert does — which needs no subprocess and is not written. Note that the earlier text here said the lock's call sites are all in cli/main.cpp: libphig/mutate.cpp has five of them, and R55 already cites two tests that drive them."

[[rule]]
id = "R50"
tier = "engine"
concern = "concurrency"
statement = "A mutating command's advisory lock is taken on the lock file belonging to the database that command is about to write."
rationale = "lock_path(db) is db + '.lock', and a catalog's lock is lock_path of its own database. The CLI installs the catalog it resolved, from --catalog, PHIG_CATALOG, the config file or the default, before any command runs, and acquire_writer_lock takes that catalog's lock. libphig's phig_acquire_write_lock calls the same lock_path on the context's database. So two processes writing one catalog exclude each other whichever surface they come through, and commands on different catalogs do not."
enforced_at = [
    "core/paths.cpp:lock_path",
    "core/lockfile.cpp:WriterLock",
    "libphig/mutate.cpp:phig_acquire_write_lock",
]
binds = [
    "scan.walk", "scan.reconcile", "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "trash.empty",
    "thumbs.rebuild", "metadata.write", "relink.transfer", "relink.demote",
    "relink.demote_live_photo",
]
protects = ["db-row", "user-metadata"]
tests = ["LockfileTest.CliLocksTheCatalogItWrites"]
test_kind = "subprocess"
status = "holds"
test_gap = "The test drives tag add, one lock-taking command; the others reach the same acquire_writer_lock, which reads current_catalog().lock, and that is read off the code."

[[rule]]
id = "R51"
tier = "engine"
concern = "concurrency"
statement = "A face id names the same face for as long as that face exists: faces.id is AUTOINCREMENT, so a deleted id is never handed to a later insert."
rationale = "A plain INTEGER PRIMARY KEY is the rowid and is assigned max(rowid)+1, so deleting the highest face gives its id to the next insert — and a full face rebuild deletes and reinserts at the tail of this table for the whole collection, which makes that the steady state rather than a corner case. AUTOINCREMENT costs one sqlite_sequence row and buys the property the three lock-free face paths lean on. Schema v8 both creates the table that way and migrates an existing one by copying rows into faces_new with their ids preserved, deliberately leaving vec_faces untouched because it is keyed on faces.id and is a vec0 virtual table the copy cannot reach. Two comments in core/ still describe the pre-v8 world and are now wrong: core/faces_engine.h and core/database.h each say faces.id is 'INTEGER PRIMARY KEY without AUTOINCREMENT' and explain the surrounding defences as compensating for reuse that no longer happens. cli/main.cpp's cmd_face comment has the current version."
enforced_at = ["core/database.cpp:init_schema"]
binds = ["faces.rebuild", "faces.identify"]
protects = ["user-metadata"]
tests = [
    "IdentifyTest.RowidsAreNotReusedAfterADelete",
    "FacesMigrationV8.PreservesIdsLabelsAndVectorsAndStopsReuse",
    "IdentifyTest.NameDoesNotLabelAFaceItDidNotMatchWhenARebuildRecyclesIds",
]
test_kind = "conformance"
status = "holds"

[[rule]]
id = "R52"
tier = "engine"
concern = "concurrency"
statement = "A face rebuild reads an image's id inside the same transaction that writes that image's faces, so an image deleted while the worker waits for the write lock costs one skipped file rather than the whole run."
rationale = "The gap between reading an id and opening the write transaction is two statements wide, and BEGIN IMMEDIATE waits on the 30-second busy timeout, so a concurrent rm holding the write lock holds that window open for as long as it likes. An insert against a deleted image_id violates the foreign key and throws, and parallel_for_each stops every worker on the first exception, so the cost of losing the race outside the transaction is the entire rebuild. Reading the id inside it means the write lock is already held and what was read cannot be deleted underneath it; a row that went before the transaction opened yields image_id < 0, a rollback and one recorded skip."
enforced_at = ["core/faces_engine.cpp:FacesEngine::run"]
binds = ["faces.rebuild"]
protects = ["db-row", "user-metadata"]
tests = ["FacesEngineRun.ImageDeletedMidRunIsSkippedRatherThanAbortingTheRun"]
test_kind = "witness"
status = "holds"
test_gap = "The witness now asserts the window was entered: result.errors above zero and at least one progress line reading 'image no longer in the database', both of which the engine produces only on this branch, so a run whose timing misses the race fails instead of passing identically. What it still does not pin is the 'rather than the whole run' half — its deleter removes every row, so no image survives to have its faces written, and the run's completion is evidenced by the absence of a throw rather than by other files finishing. The models are no longer the gap: the ubuntu-26.04 leg caches ~/.cache/phig/models and downloads on a miss, and that is the leg scripts/rules.py reads its results from, so check 2 sees this witness pass rather than skip on every push. It skips on the ubuntu-24.04 leg, whose OpenCV is below the 4.8.0 the detector needs (R84), so on that leg the rule has no evidence at all."

[[rule]]
id = "R53"
tier = "engine"
concern = "concurrency"
statement = "The busy timeout is set before the connection issues its first statement, so a process opening a collection concurrently with another waits rather than failing."
rationale = "PRAGMA journal_mode=WAL takes an exclusive lock to rewrite the file header, so the very first statement on a fresh connection is itself contendable. Setting sqlite3_busy_timeout after it leaves that one statement with no busy handler, which is what made DatabaseConcurrency.ConcurrentMigrationIsSafe flake at roughly one run in ten until 73d1e1a. The ordering is the whole rule: the same two calls in the other order compile, pass most runs, and fail under load."
enforced_at = ["core/database.cpp:Database::Database"]
binds = [
    "scan.walk", "scan.reconcile", "organize.plan", "organize.copy", "organize.move",
    "remove.trash", "remove.hard", "remove.db-only", "remove.orphans",
    "thumbs.rebuild", "faces.rebuild", "faces.identify", "metadata.write",
    "relink.transfer", "relink.demote", "relink.demote_live_photo",
]
protects = ["db-row"]
tests = [
    "DatabaseConcurrency.ConcurrentMigrationIsSafe",
    "DatabaseConcurrency.ConstructionWaitsForAFirstStatementAnotherConnectionIsBlocking",
]
test_kind = "witness"
status = "holds"
test_gap = "ConcurrentMigrationIsSafe races concurrent first-runs and would catch a regression only statistically — it is the test that flaked at about 10% when the ordering was wrong, so one green run is weak evidence. ConstructionWaitsForAFirstStatementAnotherConnectionIsBlocking replaces the race with a held lock: a second connection holds an EXCLUSIVE transaction on a database still in rollback-journal mode for 300ms, so the constructor's first statement has to wait for it, and the elapsed time is asserted rather than the outcome alone. Measured with sqlite3_busy_timeout moved below the WAL pragma, the construction throws `SQL error: database is locked` after 0ms instead of returning after 300. What that test cannot reach is a first statement other than journal_mode=WAL: the read-only constructor skips the pragma, so the ordering has no observable consequence there and nothing pins it."

[[rule]]
id = "R54"
tier = "engine"
concern = "concurrency"
statement = "The connection is opened SQLITE_OPEN_FULLMUTEX explicitly, so one shared connection called from several threads is serialized by SQLite rather than by how the system SQLite was compiled."
rationale = "libphig's header promises that a phig_ctx may be called concurrently from several threads, and a ctx holds one Database. A system SQLite compiled THREADSAFE=1 (serialized) mutexes every connection and the promise holds for free; one compiled THREADSAFE=2 (multi-thread) defaults to NOMUTEX, where sharing a connection is undefined and crashes rather than blocks. Asking for the flag means the ABI's promise does not depend on the packager's choice. That choice is not hypothetical and phig already ships against both: measured, Apple's system SQLite 3.51.0 — the library phig links on macOS, and the one the macOS CI leg builds against — reports sqlite3_threadsafe() == 2, and a connection opened there without the flag has a null sqlite3_db_mutex with no reconfiguration of any kind. So on macOS this flag is the only thing holding the header's promise up, and it is the ubuntu legs that would pass without it."
enforced_at = ["core/database.cpp:Database::Database"]
binds = ["metadata.write"]
protects = ["db-row", "user-metadata"]
tests = [
    "AbiMutate.ConcurrentFailuresOnSharedCtxDoNotCorrupt",
    "AbiMutate.ConcurrentReadsOnSharedCtxReturnConsistentResults",
    "DatabaseConcurrency.TheConnectionIsMutexedEvenWhereTheLibraryDefaultIsNot",
]
test_kind = "witness"
status = "holds"
test_gap = "The two AbiMutate tests would also pass with the flag removed on a serialized build, because such a build mutexes the connection anyway. TheConnectionIsMutexedEvenWhereTheLibraryDefaultIsNot removes that dependence by putting the library in multi-thread mode for the length of the test — sqlite3_shutdown, sqlite3_config(SQLITE_CONFIG_MULTITHREAD), sqlite3_initialize, restored to the compile-time default on every exit — and asserting a control connection opened without the flag comes back with a null sqlite3_db_mutex before asking anything of phig's. Measured with the flag removed from Database::Database: sqlite3_db_mutex on the phig connection is null and the test fails. Two limits. The reconfiguration is process-global; it is safe under ctest, which runs each case as its own process, and was measured not to disturb a full in-order run of the whole suite in one process, but it is a hazard any new fixture holding a connection open across tests would create. And where the library refuses to be reconfigured the test skips rather than failing, so on such a build this rule is back to the two AbiMutate witnesses and the gap above."

[[rule]]
id = "R55"
tier = "engine"
concern = "concurrency"
statement = "libphig's metadata writes take the writer lock without waiting and report PHIG_ERR_BUSY when it is held, and its long-running operations take no lock at all."
rationale = "A GUI must not freeze behind a CLI job, so a contended lock is reported as an error the caller can surface rather than as a block — phig_acquire_write_lock passes no_wait = true, and PHIG_CATCH's LockBusy arm is the only path to PHIG_ERR_BUSY. The operations take none for a different reason: index's write set is unknowable before the walk, thumbs writes only the filesystem cache, and faces commits per image, so SQLite's own serialization is enough and small metadata writes stay serviceable for an operation's whole duration. A lock-holding operation would turn every tag write into PHIG_ERR_BUSY for the length of the run, which is the outcome this trade exists to avoid."
enforced_at = [
    "libphig/mutate.cpp:phig_acquire_write_lock",
    "libphig/internal.h:PHIG_CATCH",
    "libphig/operations.cpp:phig_op_index_start",
]
binds = [
    "metadata.write", "scan.walk", "thumbs.rebuild", "faces.rebuild",
    "organize.plan", "organize.copy", "organize.move",
]
protects = ["db-row", "user-metadata"]
tests = [
    "AbiMutate.WriteFailsWhileAnotherProcessHoldsTheWriterLock",
    "AbiMutate.WriteSucceedsAfterTheLockIsReleased",
    "AbiOperations.MetadataWritesStayServicedWhileAnOperationRuns",
    "AbiOperations.TwoDatabaseWritingOperationsRunConcurrentlyWithoutDeadlock",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R71"
tier = "engine"
concern = "concurrency"
statement = "A face row's embedding is written only by the insert that creates the row, so identify's `embedding = ?` clause refuses no write that `id = ?` and `person_id IS NULL` have not already refused."
rationale = "Across core/, libphig/ and cli/ three statements update the faces table — `UPDATE faces SET image_id = ? WHERE image_id = ?` and the two that set person_id — and none of them writes embedding. The column is written by insert_face and by the v8 migration's `INSERT INTO faces_new (...) SELECT ... FROM faces`, both of which create rows rather than rewrite them. Re-detection is delete-and-reinsert — FacesEngine::run calls delete_faces_for_image then insert_face — which is also what keeps vec_faces in step, since it is keyed on faces.id, holds its own copy of the embedding, and is written only by those two functions. So the state this clause excludes, a row that keeps its id, stays unlabeled and carries a different embedding, is one phig cannot produce. The clause is kept deliberately: set_face_person_if_unchanged's header states it as the contract the caller wants, that the write refers to the face that was compared rather than to a row number, and as something that would catch an in-place embedding rewrite if one were added. Its cost is that phase 1 carries all 128 floats of every match into phase 2 to feed it, about 520 bytes per match where the id needs 8. Plan 044's work item 4 moves identify_person onto vec_faces KNN, which is where the choice lands: a KNN or paged phase 1 has to decide whether phase 2 still receives each matched embedding or only its id, and it cannot keep this clause without keeping the carry. 044 calls the transaction behaviour orthogonal to paging the read path, but that is about plan 031's phase split, not about this predicate's operands."
enforced_at = [
    "core/database.cpp:set_face_person_if_unchanged",
    "core/database.cpp:insert_face",
]
binds = ["faces.identify"]
protects = ["user-metadata"]
tests = ["IdentifyTest.AFaceWhoseEmbeddingChangedIsNotLabeled"]
test_kind = "witness"
status = "holds"
test_gap = "That test is the clause's only cover, and it writes the changed embedding by hand through a raw sqlite3 UPDATE because no concurrent path produces one — the test says so itself. Measured in a scratch copy with `AND embedding = ?` deleted: 806 tests ran and it was the only failure. So nothing covers this clause against a state phig can reach, and nothing can until some path rewrites an embedding in place."

[[rule]]
id = "R84"
tier = "engine"
concern = "concurrency"
statement = "An image id names the same image for as long as that image exists: images.id is AUTOINCREMENT, so a deleted id is never handed to a later insert."
rationale = "This is R51's property, for images instead of faces. Schema v9 declares images.id INTEGER PRIMARY KEY AUTOINCREMENT at core/database.cpp:453 and migrates an existing table by copying rows into images_new with their ids preserved, which seeds sqlite_sequence to the maximum so later inserts continue above it. Before v9 the column was a plain INTEGER PRIMARY KEY, which is the rowid and is assigned max(rowid)+1: measured against the system SQLite 3.51.0 phig links, three rows at ids 1-3 with the row at id 3 deleted gave id 3 to an unrelated path on the next insert. The ABI depends on this property — phig_query_page hands ids to a client and phig_tag_add, phig_gallery_set, phig_gallery_clear and phig_favorite_set take them back, with nothing between the read and the write to confirm the id still names the photo the caller saw — and reuse needed only a deletion at the tail of the table, which scan.reconcile and all four remove modes produce as ordinary operation. Plan 053's decision 2 makes an id the way every caller names a photo and 064 puts remove behind one, which is what raises the exposure from user-metadata to original-file. The migration could not reuse the v8 recipe: core/database.cpp:121 records that the faces rebuild is safe with foreign_keys=ON only because faces is a pure FK child, while image_tags.image_id and faces.image_id both reference images(id) ON DELETE CASCADE and the pragma is set on every open. SQLite's DROP TABLE deletes every row before dropping, so the rebuild would take every image_tags row and every faces row with it — measured, the tags and people tables survive intact but all tag and favorite assignments are gone and all face rows are gone, with their embeddings, boxes and person labels. No tag or person is destroyed; every association to one is. init_schema therefore runs every migration with foreign keys disabled rather than conditioning it on the version number, and calls foreign_key_violations inside each migration's transaction before the commit. That check does not cover the cascade case, which leaves no orphans and so reports zero violations; ImagesMigrationV9.PreservesRowsIdsTagsFavoritesFacesAndLabels is what covers it, and it was confirmed to fail with the pragma re-enabled."
enforced_at = [
    "core/database.cpp:init_schema",
    "core/database.cpp:foreign_key_violations",
]
binds = ["scan.reconcile", "remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "metadata.write"]
protects = ["user-metadata", "db-row"]
tests = [
    "DatabaseTest.ImageIdIsNotReusedAfterTheHighestRowIsDeleted",
    "ImagesMigrationV9.PreservesRowsIdsTagsFavoritesFacesAndLabels",
    "DatabaseTest.ForeignKeyViolationsCountsAnOrphanedChildRow",
]
test_kind = "conformance"
status = "holds"
