[[rule]]
id = "R04"
tier = "engine"
concern = "recoverability"
statement = "Deleting a row captures a restore snapshot sufficient to rebuild that row's user-authored metadata."
rationale = "A rescan rebuilds hash, EXIF and thumbnails. It cannot rebuild a tag someone typed, a gallery assignment, or a face label."
enforced_at = ["core/database.cpp:delete_paths_logged"]
binds = ["scan.reconcile", "remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["user-metadata", "db-row"]
tests = ["DatabaseTest.PurgeSnapshotMarksOmittedFaces"]
test_kind = "conformance"
status = "partial"
owner = "041"
test_gap = "The test asserts the snapshot records a face count, not that the metadata round-trips. No restorer exists to round-trip against: plan 020 deferred phig undo and plan 053 records that the activity log has no reader in core/."

[[rule]]
id = "R18"
tier = "engine"
concern = "recoverability"
statement = "A log entry describing a database change is inserted inside the same transaction as that change, so the log never records a change that did not commit."
rationale = "The log is the only account of what an operation did, and an account that disagrees with the database is worse than none, because a future undo would restore against a state that never existed. Every writer has the same shape: open a transaction, make the change, add the entry, commit — so a rollback takes the entry with it. delete_paths_logged widens the idea to a batch, with one BEGIN IMMEDIATE covering every row it deletes and every purge_row entry it writes."
enforced_at = [
    "core/organize_exec.cpp:execute_organize_action",
    "core/relink.cpp:relink_moved_rows",
    "core/relink.cpp:demote_jpeg_rows",
    "core/relink.cpp:demote_live_photo_rows",
    "core/database.cpp:delete_paths_logged",
]
binds = [
    "organize.copy", "organize.move", "scan.reconcile", "relink.transfer",
    "relink.demote", "relink.demote_live_photo", "remove.trash", "remove.hard",
    "remove.db-only", "remove.orphans",
]
protects = ["activity-log", "db-row"]
tests = [
    "OrganizeExecTest.LogsEntryWhenOpIdProvided",
    "RelinkTest.LogsRelinkEntryUnderOperation",
    "DatabaseTest.PurgeLogsRestorableSnapshot",
    "OrganizeExecTest.NoOpSelfMoveDoesNothingAndLogsNothing",
]
test_kind = "witness"
status = "holds"
owner = "054"
test_gap = "Every listed test drives the success path and checks the entry is there. Nothing drives the rollback half — a database write that throws after the entry was added, leaving neither behind. OrganizeExecTest.CopyRestoresPriorFileOnDbFailureOverwrite comes closest and passes op_id = 0, so there is no entry for it to look for."

[[rule]]
id = "R19"
tier = "engine"
concern = "recoverability"
statement = "No entry in the activity log is ever updated or deleted on its own; the only removal is log_prune, which drops whole operations oldest-first and always keeps the newest."
rationale = "A trail that can be edited in place records what someone wanted to have happened. The only statements against operation_entries are one INSERT in log_add_entry and the cascade from log_prune's DELETE FROM operations WHERE id <= ?, so an entry can only leave with the operation it belongs to; the cascade depends on PRAGMA foreign_keys=ON, set on every open. Keeping the newest operation even when it alone exceeds the cap is what stops a run pruning away its own record."
enforced_at = ["core/database.cpp:log_add_entry", "core/database.cpp:log_prune"]
binds = [
    "organize.copy", "organize.move", "scan.reconcile", "relink.transfer",
    "relink.demote", "relink.demote_live_photo", "remove.trash", "remove.hard",
    "remove.db-only", "remove.orphans",
]
protects = ["activity-log"]
tests = [
    "DatabaseTest.LogPruneDropsOldestWholeOperations",
    "DatabaseTest.LogPruneAlwaysKeepsNewestOperation",
    "DatabaseTest.LogPruneUnlimitedIsNoOp",
    "DatabaseTest.LogOperationRoundTrip",
]
test_kind = "conformance"
status = "holds"

[[rule]]
id = "R20"
tier = "engine"
concern = "authorization"
statement = "A dry-run removal takes no disk action, deletes no row and opens no logged operation, but it still creates the database file and applies any pending schema migration."
rationale = "The preview returns before the confirmation guard and before log_begin_operation, so nothing on disk moves and nothing about the selection is recorded. What it does not skip is the connection: cmd_rm constructs a Database and calls init_schema before it reads dry_run, and both create-if-missing and the forward-only migration happen there. A preview that migrates a v7 database to v8 has changed the file it was asked not to touch, and no plan says so."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row", "activity-log"]
tests = ["RemoveExecTest.RmDryRunTouchesNothing"]
test_kind = "witness"
status = "holds"
owner = "054"
test_gap = "The test checks the file and the row survive; it does not check that no operation row was opened, and nothing pins the second clause at all. Both were measured by running the binary: a dry-run rm against a path with no database left a 120 KB v8 database there, and a dry-run rm against a populated one left the operations table exactly as it found it."

[[rule]]
id = "R21"
tier = "engine"
concern = "authorization"
statement = "The copy and move preview is OrganizeEngine::plan, which writes nothing to disk or to the database, so a dry run is the caller stopping after a decision core/ already made without side effects."
rationale = "Keeping the preview in core/ rather than in a CLI branch is what lets every surface offer it: organize.plan is an operation with an ABI entry point, so a GUI showing a user what a move would do runs the same code the CLI's dry run runs. The alternative, a dry_run flag threaded into apply, would put the guard inside the function that writes, where every later edit has to remember it. Measured: a dry-run mv over three indexed files printed three destinations and left the operations table, the rows and the destination directory untouched."
enforced_at = ["core/organize_engine.cpp:OrganizeEngine::plan"]
binds = ["organize.plan"]
protects = ["original-file", "db-row", "activity-log"]
tests = ["OrganizeEngineTest.PlanWritesNothingToDiskOrDatabase"]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R22"
tier = "engine"
concern = "authorization"
statement = "A hard delete, and any removal that takes at least half the collection and touches twenty rows or more, proceeds only on an explicit yes: assume_yes, or a confirmer that returns true, with a missing confirmer counted as a refusal."
rationale = "Hard delete is the one removal mode with no trash behind it, so there is nothing to recover from afterwards and the authorization has to happen first. Counting a null confirmer as a refusal is the part that matters for a non-CLI caller: a client that never wired up a prompt gets a refusal rather than a silent deletion. How the yes is obtained — whether stdin is a terminal, what the prompt reads — is the surface's business and stays in cli/."
enforced_at = ["core/remove_exec.cpp:cmd_rm"]
binds = ["remove.hard", "remove.trash", "remove.db-only", "remove.orphans"]
protects = ["original-file", "db-row"]
tests = [
    "RemoveExecTest.ConfirmCallbackRefusalCancelsTheOperation",
    "RemoveExecTest.ConfirmCallbackNullRefusesWithoutAsking",
    "RemoveExecTest.ConfirmCallbackAcceptanceProceeds",
    "RemoveExecTest.ConfirmCallbackBroadRemovalWarningTextIsExact",
]
test_kind = "witness"
status = "holds"

[[rule]]
id = "R23"
tier = "engine"
concern = "recoverability"
statement = "The default removal mode moves a file into phig's trash directory under a name no other file can take, so the removal is reversible from disk."
rationale = "Trash is what lets rm be the ordinary removal command: the row goes, the bytes stay. The trash name is the file's stem plus eight random hex characters, generated rather than searched for, so two identically named files never race for the same slot, and move_file refuses to clobber if one ever collides — the caller retries with a fresh name. Measured: removing a tracked file with the default mode moved it to <data_dir>/trash/c.5904e5a1.jpg and logged a trash entry naming that path, beside the purge_row entry for its row."
enforced_at = ["core/remove_exec.cpp:execute_trash_action", "core/paths.cpp:trash_path_for"]
binds = ["remove.trash"]
protects = ["original-file", "attachment"]
tests = [
    "RemoveExecTest.TrashMovesFileAndLogs",
    "RemoveExecTest.TrashTwoSameNameFilesGetDistinctPathsNoClobberAndLogs",
    "RemoveExecTest.TrashManySameNameFilesAllSurviveDistinctly",
]
test_kind = "witness"
status = "holds"
owner = "053"
test_gap = "The tests cover filling the trash. Nothing covers emptying it, and nothing in core/ can: trash.empty has no core/ primitive — operations.toml records its core_entry as cli/main.cpp:cmd_trash_empty — so the count, the prompt and the non-interactive refusal guarding the one irreversible step are all CLI code, unreachable by libphig and by phigd. A client that wants the operation has to rebuild the guard rather than inherit it, which is the failure mode the enforcement-belongs-in-core rule exists to stop."

[[rule]]
id = "R24"
tier = "engine"
concern = "recoverability"
statement = "A restore snapshot carries the deleted row's tags, so restoring it returns the user-authored metadata the row held."
rationale = "R04 states the guarantee; this is the half of it that is measurably absent. Tagging a file, deleting it from disk and rescanning wrote a purge_row entry whose restore_json holds the sixteen images columns — path, filename, extension, size, dates, sha256, phash, dimensions, metadata, media type, duration, gallery, blur score, effective date — and no mention of the tag. The image_tags row went with the cascade; the tag name survives in the tags table attached to nothing. Gallery is in the snapshot because it is a column on images, and tags and faces are not because they are not. taxonomy.toml calls user-metadata the one asset nothing can reconstruct, so this is the loss the snapshot exists to prevent."
enforced_at = ["core/database.cpp:delete_paths_logged"]
binds = ["scan.reconcile", "remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["user-metadata"]
tests = ["DatabaseTest.PurgeLogsRestorableSnapshot"]
test_kind = "conformance"
status = "violated"
owner = "041"
test_gap = "The listed test pins the shape the snapshot has today: it asserts the path and the sha256 are present. Nothing asserts a tag, because no code path writes one. Plan 041 decided to make the record complete before splitting reconcile into plan and apply; this is the piece of that decision with a measurement behind it."

[[rule]]
id = "R25"
tier = "engine"
concern = "recoverability"
statement = "Deleting a row captures its restore snapshot whether the activity log is enabled or not."
rationale = "The snapshot lives in operation_entries.restore_json, so the switch that turns off the audit trail turns off the safety net with it, and nothing tells the user that. Reconcile's two branches diverge structurally rather than by a flag: the logged branch calls delete_paths_logged(to_delete, op_id) at scan_engine.cpp:587, the unlogged branch calls delete_paths(to_delete) at :611, a different function with no snapshot code in it at all. rm keeps one call path and passes op_id = 0, so delete_paths_logged builds the snapshot string and discards it. Measured: with the log disabled, tagging a file, deleting it from disk and rescanning removed the row and wrote no operation and no entry — the only rows in operations were from an earlier logged run."
enforced_at = [
    "core/scan_engine.cpp:ScanEngine::run_reconcile",
    "core/database.cpp:delete_paths",
    "core/database.cpp:delete_paths_logged",
]
binds = ["scan.reconcile", "remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["user-metadata", "db-row", "activity-log"]
tests = ["ScanEngine.ReconcileRunsRelinkBeforeDemoteOnSharedTargetUnlogged"]
test_kind = "witness"
status = "partial"
owner = "041"
test_gap = "The listed test is the only one that drives reconcile's unlogged branch, and it asserts a gallery value rather than the absence of a snapshot. Nothing in the suite covers a deletion made with logging off; the behaviour above came from running the binary."

[[rule]]
id = "R26"
tier = "engine"
concern = "recoverability"
statement = "delete_paths_logged skips a path with no row: it deletes nothing, logs nothing, and does not count it toward the number it returns."
rationale = "Plan 041's guard inventory names this as the third of three guards on the delete path, so that once reconcile is split into a plan and an apply, a plan entry that has gone stale deletes nothing rather than something else. The guard is correct and no status in this schema fits it: holds requires a passing test and there is none, partial and violated assert the code is wrong and it is not, and unenforced has meant deliberately untestable, which this is not — one call with an unknown path would pin it. It is filed as unenforced because that is the only value that makes no false claim about the code; the missing vocabulary is a finding for the phase that revises the schema. The skip is silent a second way: both callers discard the returned count. cmd_rm prints rows_to_delete.size() at remove_exec.cpp:198 and run_reconcile sets removed_count = removed_paths.size() at scan_engine.cpp:588, so a skipped path is still reported as removed."
enforced_at = ["core/database.cpp:delete_paths_logged"]
binds = ["scan.reconcile", "remove.trash", "remove.hard", "remove.db-only", "remove.orphans"]
protects = ["db-row", "activity-log"]
tests = []
test_kind = "conformance"
status = "unenforced"
owner = "054"
test_gap = "Nothing calls delete_paths_logged with a path that has no row, so neither the skip nor the returned count is pinned. Both callers build their list from rows they have just read, so today the branch is reachable only when another writer removes one in between; plan 041's plan/apply split is what makes it reachable in ordinary use, which is why the guard is there."

[[rule]]
id = "R27"
tier = "engine"
concern = "recoverability"
statement = "An operation that did not do everything it was asked to do is recorded with a terminal status that says so."
rationale = "cmd_rm counts its per-file failures and writes interrupted when there were any. OrganizeEngine::apply writes interrupted only when result.completed is false, and that is false only for cancellation — a file whose move threw increments result.errors and leaves completed true. So the same fact, some files did not make it, produces two different terminal statuses depending on which command wrote the log, and a reader cannot tell a clean copy run from one that lost half its files. Neither behaviour is written down. Plan 056 is the nearest open owner, being the plan redesigning what an operation status means, though its current scope is the ABI's live operations rather than this table."
enforced_at = ["core/remove_exec.cpp:cmd_rm", "core/organize_engine.cpp:OrganizeEngine::apply"]
binds = ["remove.trash", "remove.hard", "remove.db-only", "remove.orphans", "organize.copy", "organize.move"]
protects = ["activity-log"]
tests = ["OrganizeEngineTest.CancellationPartwayMarksTheOperationInterrupted"]
test_kind = "witness"
status = "violated"
owner = "056"
test_gap = "The listed test pins the cancellation case, where organize does write interrupted. Nothing covers a run with per-file errors, which is where the two commands disagree."
