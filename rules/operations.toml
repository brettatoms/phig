read_only_abi = [
    "phig_abi_version", "phig_init", "phig_shutdown", "phig_last_error",
    "phig_string_free", "phig_image_list_free", "phig_image_metadata",
    "phig_query_new", "phig_query_free", "phig_query_page", "phig_query_count",
    "phig_query_add_tag", "phig_query_set_camera", "phig_query_set_date_range",
    "phig_query_set_duration_range", "phig_query_set_extension",
    "phig_query_set_gallery", "phig_query_set_make", "phig_query_set_media",
    "phig_query_set_sharpness", "phig_query_set_size_range",
    "phig_query_set_sort", "phig_thumb_lookup",
    # Glob predicates and id resolution (plan 053 decision 2). The two setters
    # mutate only the caller's query object, phig_query_ids is a read, and the
    # free releases what that read returned — none of them touches a collection.
    "phig_query_add_match", "phig_query_add_exclude",
    "phig_query_ids", "phig_id_list_free",
    "phig_op_cancel", "phig_op_free", "phig_op_poll", "phig_op_status",
    "phig_op_wait", "phig_op_error", "phig_op_error_at", "phig_op_error_count",
    "phig_op_index_result", "phig_op_thumbs_result", "phig_op_faces_result",
    "phig_op_organize_result", "phig_op_organize_plan_take",
    "phig_organize_plan_free", "phig_organize_plan_count",
    "phig_organize_plan_source_at", "phig_organize_plan_dest_at",
    "phig_organize_plan_conflicts_at", "phig_organize_plan_resolution_at",
    "phig_organize_plan_occupant_tracked_at",
    "phig_organize_plan_set_resolution",
    "phig_settings_load", "phig_settings_free", "phig_settings_get",
    "phig_settings_get_bool", "phig_settings_get_int", "phig_settings_get_raw",
    "phig_settings_has", "phig_settings_count", "phig_settings_key_at",
    "phig_settings_set", "phig_settings_unset", "phig_settings_to_config",
    # phig_settings_save does mutate — it writes phig's own config file
    # (temp + rename) — but touches none of the six assets in taxonomy.toml,
    # so no operation covers it either. See task-1-report.md.
    "phig_settings_save",
]

# CLI top-level commands that map to no operation in this record set. Only help
# mutates nothing. The other two mutate through --output, which truncates
# whatever file it names (R69), recorded rather than fixed here. They stay on
# this list because the list's job is to account for every top-level command,
# and neither is an operation — no core/ primitive backs either one.
#
# models mutates too — it writes the YuNet and SFace files into the models
# cache under a lock of its own in that directory — but touches none of the
# seven assets in taxonomy.toml, so no operation covers it either. Same
# position as phig_settings_save above. Face-model download is listed as missing from the
# ABI in libphig/CLAUDE.md, owned by 053.
read_only_cli = ["search", "duplicates", "help", "models"]

# Every long flag cli/main.cpp parses, split by whether it can change what is
# written. read_only_cli above accounts for top-level commands; these two lists
# do the same one level down, so the denominator a reader sees is every flag
# rather than the ones somebody happened to write a rule for. Plan 054 phase 3,
# workstream B.
#
# A flag lands in mutating_cli_flags when any command it reaches can change
# bytes on disk or rows in the database through it — including changing *which*
# files an operation writes to or destroys, not only whether it writes at all.
# One verdict per name, as read_only_cli gives one verdict per command: --format
# is on the mutating list because cp and mv compute destination paths from it,
# even though the same spelling on search, duplicates and fav list only picks
# between text, csv and json.
#
# "Belongs to a read-only command" is not a reason to file a flag read-only,
# and two of search's did exactly that in the first pass. --similar and --face
# accept "-", and reading stdin truncates whatever is at a fixed path in the
# temp directory (R81). search is on read_only_cli as a command and three of
# its flags are on the mutating list.
#
# The split was read off cli/main.cpp branch by branch, not scripted. scan,
# cp/mv, rm and trash parse inline in main() while the other commands parse in
# their own cmd_* function, so a classifier that attributes a flag to the
# function containing it calls every inline flag read-only. What is scripted is
# only the existence check: scripts/rules.py's check_coverage extracts every
# "--x" literal from cli/main.cpp and requires each to be on exactly one of
# these lists, so a new flag fails the build until somebody classifies it.
#
# Short aliases are not listed: -v, -h and -y are spellings of --version,
# --help and --yes and carry those flags' verdicts. --size is not listed
# either — the help text advertises it (cli/main.cpp:129) and no parser branch
# reads it, so `thumbs rebuild --size 768` exits 1 with "Unknown option". Plan
# 043 owns wiring it; when it lands it belongs on the mutating list, since it
# decides which thumbnail files are written.
mutating_cli_flags = [
    # Global. --config picks the file that supplies the catalog setting and
    # models_dir, and that seeds log.enabled, so it decides which collection a
    # mutating command writes, where thumbnails and models land, and whether
    # the activity log records anything (R25 covers the restore snapshot
    # surviving a disabled log).
    # --no-wait decides whether a mutating command waits for the writer lock or
    # exits 1 without running (R49, R50).
    "--config", "--no-wait",
    # Global. Names the catalog whose database is created, migrated and written,
    # whose lock is taken, and whose trash and thumbnails are written and deleted.
    "--catalog",
    # scan. Which files the walk admits, hence which rows are inserted and
    # updated; R75 records that none of them widens what reconcile deletes.
    "--recursive", "--media", "--hidden",
    # scan and thumbs rebuild. --force bypasses the mtime skip and regenerates
    # thumbnails; R76 records that no value of it reaches face data.
    "--force",
    # scan. Fold face detection and thumbnail generation into the indexing
    # pass — R72 guards the first, and both write.
    "--faces", "--thumbs",
    # scan and rm. Turns a row the mount heuristic would keep into a row that
    # is deleted (R14).
    "--ignore-mount-warning",
    # scan. `fail` aborts the run before its destructive reconcile phase (R80).
    "--on-error",
    # duplicates, search and fav list. Truncates whatever file it names (R69).
    "--output",
    # cp and mv. The destination path format, so it decides what gets written
    # where and which destinations collide (R01, R03).
    "--format",
    # cp, mv, rm, thumbs rebuild, face rebuild, tag, gallery and fav. Which
    # files an operation moves, deletes, re-detects or labels (R74).
    "--match", "--exclude",
    # cp and mv (R21), rm (R20), thumbs clean (R77). The flag whose failure
    # mode is a write.
    "--dry-run",
    # cp and mv. `overwrite` replaces the file at an occupied destination
    # (R01, R02, R05, R06, R08, R09, R10, R11).
    "--on-conflict",
    # rm. Which removal mode runs: permanent instead of trash, row without
    # file, or rows whose files are already gone (R12, R13, R14, R22, R23).
    "--hard", "--db-only", "--orphans",
    # rm (R22) and trash empty (R68). Skips the confirmation.
    "--yes",
    # tag, gallery and fav. A directory prefix selecting which rows are
    # written; one of the two flags that satisfies the named-selection guard
    # (R78).
    "--path",
    # gallery set. Whether an existing gallery assignment is replaced (R79).
    "--no-overwrite",
    # search. Both accept "-" for stdin, and reading stdin writes a file at a
    # fixed path in the temp directory, through a symlink if one is there
    # (R81). The query itself only reads; the flag's value decides whether
    # anything is written at all, which is what puts them here. Everything
    # else about them — the phash comparison, the face embedding — is a read.
    "--similar", "--face",
]

# Flags that change only what is read or printed. Recorded rather than omitted:
# a flag missing from both lists would be indistinguishable from one nobody had
# looked at.
read_only_cli_flags = [
    # Global, and not the same case as each other. --version returns at
    # cli/main.cpp:1815, above load_config (:1824), migrate_flat_thumb_cache
    # (:1835) and log_init (:1843), so it writes nothing at all — measured
    # under a fresh set of XDG directories, it created no file. --help returns
    # at :1855, below all three, so it can rename files in the thumbnail cache
    # and it does create the diagnostic log: the same measurement left
    # state/phig/phig.log behind. That happens with or without the flag, so
    # --help still reduces what a run writes rather than adding to it, which is
    # why it is read-only. The pre-dispatch writes belong to R70's territory —
    # a read is not free — not to this flag.
    "--version", "--help",
    # scan, thumbs rebuild, face rebuild. Worker count. It changes how many
    # threads write, never what any of them writes; the concurrency rules
    # (R28, R52, R53, R54) bind those writes directly.
    "--parallel",
    # duplicates. Which duplicate groups are computed and shown.
    "--type",
    # duplicates and search. Hamming distance for the near/similar comparison.
    "--threshold",
    # duplicates and search. Restricts the result set — unrelated to the
    # `fav` command, which mutates.
    "--fav",
    # search. Query predicates, every one of them a WHERE clause.
    "--ext", "--after", "--before", "--camera", "--make",
    "--min-size", "--max-size", "--min-duration", "--max-duration",
    # --similar and --face are NOT here: both take "-" and write (R81).
    "--similar-hash", "--face-threshold", "--person",
    # search. --tag and --gallery here read the metadata that the tag and
    # gallery commands write; the flags themselves only filter.
    "--tag", "--gallery",
    "--blurry", "--min-sharpness", "--max-sharpness",
    # search and fav list. How much is printed and in what shape. --output is
    # the one output flag that is not on this list.
    "--limit", "--count", "--porcelain", "--print0",
]

# core/ headers whose declared functions must each map to an operation or be
# listed in core_read_only below. Bounded on purpose: widening this list is a
# deliberate act, not a side effect.
core_headers = [
    "core/scan_engine.h",
    "core/organize_engine.h",
    "core/organize_exec.h",
    "core/remove_exec.h",
    "core/thumbs_engine.h",
    "core/faces_engine.h",
    "core/relink.h",
]

# core/ declarations that mutate real data but are the inside of an
# operation already below, with no caller outside core/. A rule that lives
# in such a function anchors its enforced_at there and binds the operation
# that covers it — R01 is the worked example: enforced_at =
# core/paths.cpp:resolve_conflict, binds organize.copy and organize.move,
# and resolve_conflict is not an operation. Do not promote one of these to
# an operation to get it classified: an operation carries
# surfaces_abi/surfaces_cli, and the generated missing-coverage table
# treats an empty surfaces_abi as a capability libphig lacks, so an
# internal executor listed as an operation manufactures a false gap, and a
# rule bound to it drains the cell of the user-facing operation a reader
# would actually consult. Found by Task 2's header scan; see
# task-2-report.md for how each entry was found and reasoned about.
core_internal = [
    "execute_organize_action",     # organize.copy/organize.move's per-file
                                    # disk action; called only from
                                    # OrganizeEngine::apply
    "carry_sidecars",              # organize.copy/organize.move's sidecar
                                    # and attached-JPEG carry; called only
                                    # from OrganizeEngine::apply. Refuses an
                                    # occupied destination
                                    # (refuse_occupied_carry_destination)
                                    # rather than overwriting it — unlike
                                    # move, it is not destructive
    "execute_trash_action",        # remove.trash's per-file action; called
                                    # only from remove_media_with_sidecars,
                                    # itself called only from cmd_rm
    "execute_hard_delete_action",  # remove.hard's per-file action; same
                                    # call chain as execute_trash_action
    "remove_media_with_sidecars",  # dispatches to the two actions above;
                                    # called only from cmd_rm
                                    # (remove.trash/remove.hard)
    "ensure_thumb",                # thumbs.rebuild's single-row
                                    # generation; writes one cache file. The
                                    # exception to "no caller outside core/":
                                    # libphig's phig_thumb_generate, a
                                    # thumbs.rebuild surface, and the gtk
                                    # client's collection seam both call it
    "ScanEngine::run",             # composition of scan.walk +
                                    # scan.reconcile with zero production
                                    # callers — cli/main.cpp and libphig/
                                    # both call the split phases instead;
                                    # exercised only by tests
]

# core/ declarations found by Task 2's header scan that map to no operation.
# Two shapes: (a) real declared functions/methods that mutate nothing
# taxonomy.toml tracks, and (b) words the scan's regex misreads as a call —
# an English word before a parenthetical remark, a type name inside a
# template argument, or a function named in a comment but declared outside
# these seven headers. Grouped by header, in the order the scan reports them.
core_read_only = [
    # core/scan_engine.h
    "any",                  # ForceOptions::any() — reads its own three bools, no I/O
    "set_all",               # ForceOptions::set_all() — sets its own three bools; the
                             # struct is a caller-built value object, not a tracked asset
    "process_file",          # pure per-file hash/exif/phash compute; writes nothing —
                             # scan.walk's run_workers is what persists the result
    "detector_for_worker",   # pure index-to-instance lookup, no mutation
    "separately", "done", "models", "all", "metadata", "drop", "engine",
    "build_options",         # prose: a word before a parenthetical remark, or (for
                             # build_options) a hypothetical name inside a code comment

    # core/organize_engine.h
    "resolve_conflict",      # named in a comment; declared in core/paths.cpp, outside
                             # the seven headers — pure path resolution, R01's anchor
    "size", "at",            # OrganizePlan::size()/at() — read-only accessors
    "set_resolution",        # OrganizePlan::set_resolution() — mutates only the
                             # caller-owned, not-yet-applied plan object; mirrors
                             # phig_organize_plan_set_resolution in read_only_abi above

    # core/organize_exec.h
    "file", "first", "failure", "match", "carry",  # prose
    "get_image_id",          # named in a comment; declared in core/database.h, a DB read

    # core/remove_exec.h
    "lifecycle", "mount", "action", "on", "bool", "success", "required",  # prose
    "trash_dir", "trash_path_for",  # named in comments; declared in core/paths.cpp,
                             # both pure path-string computation, no mutation
    "find_sidecars",         # named in a comment; declared in core/sidecar.h, a
                             # directory listing, no mutation

    # core/thumbs_engine.h
    "thumb_needs_generating",  # pure predicate over an in-memory ImageInfo, no mutation

    # core/faces_engine.h
    "embedding",              # prose

    # core/relink.h
    "link", "nothing", "cleanup", "disk", "row", "alone",  # prose
]

