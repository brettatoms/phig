# ABI symbols that map to no operation in this record set.
read_only_abi = [
    "phig_abi_version", "phig_init", "phig_shutdown", "phig_last_error",
    "phig_string_free", "phig_image_list_free", "phig_image_metadata",
    "phig_query_new", "phig_query_free", "phig_query_page", "phig_query_count",
    "phig_query_add_tag", "phig_query_set_camera", "phig_query_set_date_range",
    "phig_query_set_duration_range", "phig_query_set_extension",
    "phig_query_set_gallery", "phig_query_set_make", "phig_query_set_media",
    "phig_query_set_sharpness", "phig_query_set_size_range",
    "phig_query_set_sort", "phig_thumb_lookup",
    "phig_op_cancel", "phig_op_free", "phig_op_poll", "phig_op_status",
    "phig_op_wait", "phig_op_error", "phig_op_error_at", "phig_op_error_count",
    "phig_op_index_result", "phig_op_thumbs_result", "phig_op_faces_result",
    "phig_op_organize_result", "phig_op_organize_plan_take",
    "phig_organize_plan_free", "phig_organize_plan_count",
    "phig_organize_plan_source_at", "phig_organize_plan_dest_at",
    "phig_organize_plan_conflicts_at", "phig_organize_plan_resolution_at",
    "phig_organize_plan_occupant_tracked_at",
    "phig_organize_plan_set_resolution",
    "phig_settings_load", "phig_settings_free", "phig_settings_get",
    "phig_settings_get_bool", "phig_settings_get_int", "phig_settings_get_raw",
    "phig_settings_has", "phig_settings_count", "phig_settings_key_at",
    "phig_settings_set", "phig_settings_unset", "phig_settings_to_config",
    # phig_settings_save does mutate — it writes phig's own config file
    # (temp + rename) — but touches none of the six assets in taxonomy.toml,
    # so no operation covers it either. See task-1-report.md.
    "phig_settings_save",
]

# CLI top-level commands that mutate nothing.
read_only_cli = ["search", "duplicates", "help"]

# core/ headers whose declared functions must each map to an operation or be
# listed in core_read_only below. Bounded on purpose: widening this list is a
# deliberate act, not a side effect.
core_headers = [
    "core/scan_engine.h",
    "core/organize_engine.h",
    "core/organize_exec.h",
    "core/remove_exec.h",
    "core/thumbs_engine.h",
    "core/faces_engine.h",
    "core/relink.h",
]

# core/ declarations found by Task 2's header scan that map to no operation.
# Two shapes: (a) real declared functions/methods that mutate nothing
# taxonomy.toml tracks, and (b) words the scan's regex misreads as a call —
# an English word before a parenthetical remark, a type name inside a
# template argument, or a function named in a comment but declared outside
# these seven headers. Grouped by header, in the order the scan reports them.
core_read_only = [
    # core/scan_engine.h
    "any",                  # ForceOptions::any() — reads its own three bools, no I/O
    "set_all",               # ForceOptions::set_all() — sets its own three bools; the
                             # struct is a caller-built value object, not a tracked asset
    "process_file",          # pure per-file hash/exif/phash compute; writes nothing —
                             # scan.walk's run_workers is what persists the result
    "detector_for_worker",   # pure index-to-instance lookup, no mutation
    "separately", "done", "models", "all", "metadata", "drop", "engine",
    "build_options",         # prose: a word before a parenthetical remark, or (for
                             # build_options) a hypothetical name inside a code comment

    # core/organize_engine.h
    "resolve_conflict",      # named in a comment; declared in core/paths.cpp, outside
                             # the seven headers — pure path resolution, R01's anchor
    "size", "at",            # OrganizePlan::size()/at() — read-only accessors
    "set_resolution",        # OrganizePlan::set_resolution() — mutates only the
                             # caller-owned, not-yet-applied plan object; mirrors
                             # phig_organize_plan_set_resolution in read_only_abi above

    # core/organize_exec.h
    "file", "first", "failure", "match", "carry",  # prose
    "get_image_id",          # named in a comment; declared in core/database.h, a DB read

    # core/remove_exec.h
    "lifecycle", "mount", "action", "on", "bool", "success", "required",  # prose
    "trash_dir", "trash_path_for",  # named in comments; declared in core/paths.cpp,
                             # both pure path-string computation, no mutation
    "find_sidecars",         # named in a comment; declared in core/sidecar.h, a
                             # directory listing, no mutation

    # core/thumbs_engine.h
    "thumb_needs_generating",  # pure predicate over an in-memory ImageInfo, no mutation

    # core/faces_engine.h
    "embedding",              # prose

    # core/relink.h
    "link", "nothing", "cleanup", "disk", "row", "alone",  # prose
]

